<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play</title>

<style>
body{
margin:0;
font-family:Arial;
background:url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
color:white;
}
.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
padding:20px;
}
button{
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin:5px;
}
.victory{background:#00c8ff;color:white;width:45%;}
.back{background:#777;}
.page{display:none;}
.active{display:block;}
.ranking-item{
display:flex;
justify-content:space-between;
border-bottom:1px solid rgba(255,255,255,0.2);
padding:5px 0;
}
.timer{font-size:22px;margin-top:10px;}
</style>
</head>

<body>
<div class="overlay">

<div id="game" class="active">
<h1>Partidas</h1>

<h2 id="match"></h2>

<button class="victory" id="btn1">Vitória Time 1</button>
<button class="victory" id="btn2">Vitória Time 2</button>

<div class="timer" id="timer">00:00</div>

<h2>Ranking</h2>
<div id="ranking"></div>

</div>

</div>

<script>

let teams = JSON.parse(localStorage.getItem("teams")) || ["Murilo","Ana","Carlos","João"];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

teams.forEach(t=>{
if(!stats[t]){
stats[t]={wins:0,losses:0,saldo:0};
}
});

let queue=[...teams];
let currentMatch=[];
let lastWinner=null;
let streak=0;
let seconds=0;
let timerInterval;

function save(){
localStorage.setItem("teams",JSON.stringify(teams));
localStorage.setItem("stats",JSON.stringify(stats));
}

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function nextMatch(){

if(queue.length<2){
queue=[...teams];
shuffle(queue);
}

currentMatch=[queue.shift(),queue.shift()];
document.getElementById("match").innerText=
currentMatch[0]+" VS "+currentMatch[1];

resetTimer();
}

function handleWinner(index){

if(!currentMatch.length) return;

let winner=currentMatch[index];
let loser=currentMatch[index===0?1:0];

stats[winner].wins++;
stats[winner].saldo++;
stats[loser].losses++;
stats[loser].saldo--;

if(lastWinner===winner){
streak++;
}else{
streak=1;
lastWinner=winner;
}

/* REGRA DEFINITIVA */

if(streak===2){
streak=0;
lastWinner=null;
queue.push(loser);
}else{
queue.unshift(winner);
queue.push(loser);
}

save();
renderRanking();
nextMatch();
}

function renderRanking(){
let div=document.getElementById("ranking");
div.innerHTML="";
let sorted=[...teams].sort((a,b)=>stats[b].saldo-stats[a].saldo);

sorted.forEach(t=>{
div.innerHTML+=`
<div class="ranking-item">
<span>${t}</span>
<span>${stats[t].saldo}</span>
</div>`;
});
}

function resetTimer(){
clearInterval(timerInterval);
seconds=0;
timerInterval=setInterval(()=>{
seconds++;
let m=Math.floor(seconds/60);
let s=seconds%60;
document.getElementById("timer").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
},1000);
}

/* EVENT LISTENERS GARANTIDOS */

document.getElementById("btn1").addEventListener("click",()=>handleWinner(0));
document.getElementById("btn2").addEventListener("click",()=>handleWinner(1));

shuffle(queue);
nextMatch();
renderRanking();

</script>

</body>
</html>
