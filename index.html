<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
background:url('arquivo_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
background:rgba(0,0,0,0.75);
backdrop-filter:blur(6px);
width:95%;
max-width:500px;
padding:20px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,0.8);
}

h1{
text-align:center;
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:10px;
background:#00c3ff;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0096c7;
}

.team-list{
margin-top:10px;
max-height:120px;
overflow:auto;
}

.match{
margin-top:15px;
padding:10px;
background:rgba(255,255,255,0.1);
border-radius:10px;
text-align:center;
}

.ranking{
margin-top:15px;
}

footer{
position:fixed;
bottom:0;
width:100%;
text-align:center;
padding:10px;
background:rgba(0,0,0,0.6);
font-weight:bold;
letter-spacing:1px;
}
</style>
</head>

<body>

<div class="container">

<h1>Mix Play</h1>

<input type="text" id="teamName" placeholder="Nome do time">
<button onclick="addTeam()">Cadastrar Time</button>
<button onclick="deleteTeam()">Excluir Time</button>

<div class="team-list" id="teamList"></div>

<button onclick="generateMatch()">Gerar Partida</button>

<div class="match" id="matchArea"></div>

<div class="ranking">
<h3>Ranking</h3>
<div id="rankingArea"></div>
</div>

</div>

<footer>
Criado por Murilo Pompeo
</footer>

<script>

let teams = JSON.parse(localStorage.getItem("teams")) || [];
let wins = JSON.parse(localStorage.getItem("wins")) || {};
let currentMatch = JSON.parse(localStorage.getItem("currentMatch")) || null;
let consecutiveWins = JSON.parse(localStorage.getItem("consecutiveWins")) || {};

function saveData(){
localStorage.setItem("teams", JSON.stringify(teams));
localStorage.setItem("wins", JSON.stringify(wins));
localStorage.setItem("currentMatch", JSON.stringify(currentMatch));
localStorage.setItem("consecutiveWins", JSON.stringify(consecutiveWins));
}

function addTeam(){
let name = document.getElementById("teamName").value.trim();
if(!name) return;

if(!teams.includes(name)){
teams.push(name);
wins[name]=0;
consecutiveWins[name]=0;
saveData();
renderTeams();
renderRanking();
}

document.getElementById("teamName").value="";
}

function deleteTeam(){
let name = document.getElementById("teamName").value.trim();
if(teams.includes(name)){
teams = teams.filter(t=>t!==name);
delete wins[name];
delete consecutiveWins[name];
saveData();
renderTeams();
renderRanking();
}
}

function renderTeams(){
let list=document.getElementById("teamList");
list.innerHTML="";
teams.forEach(t=>{
list.innerHTML+=`<div>${t}</div>`;
});
}

function generateMatch(){

if(teams.length<2){
alert("Cadastre pelo menos 2 times");
return;
}

let availableTeams = [...teams];

if(currentMatch){
let lastWinner = currentMatch.winner;
if(lastWinner && consecutiveWins[lastWinner]>=2){
consecutiveWins[lastWinner]=0;
}
}

let shuffled = availableTeams.sort(()=>0.5-Math.random());

currentMatch={
team1:shuffled[0],
team2:shuffled[1],
winner:null
};

saveData();
renderMatch();
}

function renderMatch(){
let area=document.getElementById("matchArea");

if(!currentMatch){
area.innerHTML="";
return;
}

area.innerHTML=`
<h3>${currentMatch.team1} VS ${currentMatch.team2}</h3>
<button onclick="setWinner('${currentMatch.team1}')">${currentMatch.team1} venceu</button>
<button onclick="setWinner('${currentMatch.team2}')">${currentMatch.team2} venceu</button>
`;
}

function setWinner(team){

if(!currentMatch) return;

wins[team]++;
consecutiveWins[team]++;
currentMatch.winner=team;

let loser = (team===currentMatch.team1)?currentMatch.team2:currentMatch.team1;
consecutiveWins[loser]=0;

saveData();
renderRanking();

if(consecutiveWins[team]>=2){
generateMatch();
}else{
let nextOpponent = teams.find(t=>t!==team);
currentMatch={
team1:team,
team2:nextOpponent,
winner:null
};
saveData();
renderMatch();
}

}

function renderRanking(){
let area=document.getElementById("rankingArea");
let sorted=Object.entries(wins).sort((a,b)=>b[1]-a[1]);

area.innerHTML="";
sorted.forEach(r=>{
area.innerHTML+=`<div>${r[0]} - ${r[1]} vitórias</div>`;
});
}

renderTeams();
renderRanking();
renderMatch();

</script>

</body>
</html>
