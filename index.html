<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota77 - Sistema de Jogos</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
color:white;
min-height:100vh;
}

.overlay{
background:rgba(0,0,0,0.7);
min-height:100vh;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.page{
display:none;
}

.active{
display:block;
}

input{
padding:10px;
width:70%;
border-radius:8px;
border:none;
margin-right:5px;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.add-btn{
background:#00ff88;
}

.remove-btn{
background:#ff4444;
font-size:12px;
padding:5px 8px;
}

.start-btn{
background:#ffaa00;
margin-top:20px;
width:100%;
}

.game-box{
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:12px;
margin-top:20px;
text-align:center;
}

.victory-btn{
background:#00ccff;
width:45%;
margin:5px;
}

.back-btn{
background:#666;
margin-top:20px;
}

.ranking{
margin-top:20px;
}

.ranking-item{
display:flex;
justify-content:space-between;
padding:5px 0;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.timer{
font-size:24px;
margin-top:10px;
}
</style>
</head>

<body>
<div class="overlay">

<!-- PAGINA 1 -->
<div id="cadastro" class="page active">
<h1>Cadastro de Times</h1>

<input type="text" id="teamInput" placeholder="Nome do time">
<button class="add-btn" onclick="addTeam()">Adicionar</button>

<div id="teamList"></div>

<button class="start-btn" onclick="goToGame()">Gerar Partidas</button>
</div>

<!-- PAGINA 2 -->
<div id="partidas" class="page">
<h1>Partidas</h1>

<div class="game-box">
<h2 id="matchDisplay">Aguardando...</h2>

<div>
<button class="victory-btn" onclick="declareWinner(1)">Vitória Time 1</button>
<button class="victory-btn" onclick="declareWinner(2)">Vitória Time 2</button>
</div>

<div class="timer" id="timer">00:00</div>
</div>

<div class="ranking">
<h2>Ranking</h2>
<div id="rankingList"></div>
</div>

<button class="back-btn" onclick="backToRegister()">Voltar</button>
</div>

</div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};
let queue = [];
let currentMatch = [];
let winnerStreak = 0;
let currentWinner = null;
let seconds = 0;
let timerInterval = null;

function saveData(){
localStorage.setItem("teams", JSON.stringify(teams));
localStorage.setItem("stats", JSON.stringify(stats));
}

function addTeam(){
let input = document.getElementById("teamInput");
let name = input.value.trim();
if(!name) return;

teams.push(name);
stats[name] = stats[name] || {wins:0, losses:0, saldo:0};
input.value="";
saveData();
renderTeams();
}

function removeTeam(name){
teams = teams.filter(t => t!==name);
delete stats[name];
saveData();
renderTeams();
}

function renderTeams(){
let list = document.getElementById("teamList");
list.innerHTML="";
teams.forEach(team=>{
list.innerHTML+=`
<div style="margin-top:10px;">
${team}
<button class="remove-btn" onclick="removeTeam('${team}')">X</button>
</div>`;
});
}
renderTeams();

function goToGame(){
if(teams.length<2) return alert("Cadastre ao menos 2 times");
queue = [...teams];
shuffle(queue);
nextMatch();
document.getElementById("cadastro").classList.remove("active");
document.getElementById("partidas").classList.add("active");
}

function backToRegister(){
document.getElementById("partidas").classList.remove("active");
document.getElementById("cadastro").classList.add("active");
}

function shuffle(array){
for(let i=array.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
}

function nextMatch(){
if(queue.length<2){
queue=[...teams];
shuffle(queue);
}

currentMatch=[queue.shift(), queue.shift()];
document.getElementById("matchDisplay").innerText =
currentMatch[0]+" VS "+currentMatch[1];

resetTimer();
}

function declareWinner(teamNumber){
if(!currentMatch.length) return;

let winner = currentMatch[teamNumber-1];
let loser = currentMatch[teamNumber===1?1:0];

stats[winner].wins++;
stats[winner].saldo++;
stats[loser].losses++;
stats[loser].saldo--;

if(currentWinner===winner){
winnerStreak++;
}else{
winnerStreak=1;
currentWinner=winner;
}

if(winnerStreak===2){
winnerStreak=0;
currentWinner=null;
queue.push(loser);
}else{
queue.unshift(winner);
queue.push(loser);
}

saveData();
renderRanking();
nextMatch();
}

function renderRanking(){
let rankingDiv=document.getElementById("rankingList");
rankingDiv.innerHTML="";

let sorted=[...teams].sort((a,b)=>stats[b].saldo - stats[a].saldo);

sorted.forEach(team=>{
rankingDiv.innerHTML+=`
<div class="ranking-item">
<span>${team}</span>
<span>Saldo: ${stats[team].saldo}</span>
</div>`;
});
}

function resetTimer(){
clearInterval(timerInterval);
seconds=0;
timerInterval=setInterval(()=>{
seconds++;
let min=Math.floor(seconds/60);
let sec=seconds%60;
document.getElementById("timer").innerText=
String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");
},1000);
}

renderRanking();
</script>

</body>
</html>
