<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  color:white;
  text-align:center;
  background:url("file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

.container{
  background:rgba(0,0,0,0.65);
  min-height:100vh;
  padding:20px;
}

button{
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.blue{ background:#19b6d2; color:white; }
.gray{ background:#ccc; color:black; }

input{
  padding:8px;
  border-radius:6px;
  border:none;
}

.hidden{ display:none; }

h1{ margin-top:10px; }
</style>
</head>
<body>

<div class="container">

<!-- ================= CADASTRO ================= -->
<div id="cadastroPage">
<h1>Cadastro de Times</h1>

<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<button onclick="startGames()" class="blue">Ir para Partidas</button>
</div>


<!-- ================= PARTIDAS ================= -->
<div id="gamePage" class="hidden">

<h1>Partidas</h1>

<h2 id="matchTitle"></h2>

<button onclick="win(1)" class="blue">Vitória Time 1</button>
<button onclick="win(2)" class="blue">Vitória Time 2</button>

<h2 id="timer">00:00</h2>

<h1>Ranking</h1>
<div id="ranking"></div>

<button onclick="goBack()" class="gray">Voltar</button>

</div>

</div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};
let queue = [];
let currentMatch = [];
let winnerStreak = 0;
let currentWinner = null;
let timerInterval;
let seconds = 0;

/* ================= SALVAR ================= */
function saveData(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

/* ================= CADASTRO ================= */
function addTeam(){
  const name = document.getElementById("teamInput").value.trim();
  if(!name) return;

  teams.push(name);
  stats[name] = {wins:0, losses:0};
  document.getElementById("teamInput").value="";
  saveData();
  renderTeams();
}

function renderTeams(){
  const list = document.getElementById("teamList");
  list.innerHTML="";
  teams.forEach((team,i)=>{
    const li=document.createElement("li");
    li.innerHTML = team + 
    " <button onclick='removeTeam("+i+")' class='gray'>X</button>";
    list.appendChild(li);
  });
}

function removeTeam(i){
  delete stats[teams[i]];
  teams.splice(i,1);
  saveData();
  renderTeams();
}

/* ================= INICIAR ================= */
function startGames(){
  if(teams.length < 2) return alert("Cadastre pelo menos 2 times");

  queue = [...teams];
  currentWinner = null;
  winnerStreak = 0;

  document.getElementById("cadastroPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  nextMatch();
}

/* ================= PARTIDAS ================= */
function nextMatch(){

  if(currentWinner && winnerStreak < 2){
    // vencedor joga novamente
    const nextOpponent = queue.find(t=>t!==currentWinner);
    currentMatch = [currentWinner, nextOpponent];
  }else{
    // troca obrigatória
    if(currentWinner){
      queue.push(currentWinner);
    }
    currentWinner = null;
    winnerStreak = 0;

    const t1 = queue.shift();
    const t2 = queue.shift();
    queue.push(t1);
    queue.push(t2);

    currentMatch = [t1,t2];
  }

  document.getElementById("matchTitle").innerText =
    currentMatch[0] + " VS " + currentMatch[1];

  startTimer();
  renderRanking();
}

function win(teamNumber){

  const winner = currentMatch[teamNumber-1];
  const loser = currentMatch[teamNumber===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;

  saveData();

  if(currentWinner === winner){
    winnerStreak++;
  }else{
    currentWinner = winner;
    winnerStreak = 1;
  }

  // remove perdedor da frente da fila
  queue = queue.filter(t=>t!==loser);
  queue.push(loser);

  nextMatch();
}

/* ================= TIMER ================= */
function startTimer(){
  clearInterval(timerInterval);
  seconds = 0;
  timerInterval = setInterval(()=>{
    seconds++;
    let m = String(Math.floor(seconds/60)).padStart(2,"0");
    let s = String(seconds%60).padStart(2,"0");
    document.getElementById("timer").innerText = m+":"+s;
  },1000);
}

/* ================= RANKING ================= */
function renderRanking(){
  const div = document.getElementById("ranking");
  div.innerHTML="";

  const ranking = Object.keys(stats).map(team=>{
    return {
      name:team,
      wins:stats[team].wins,
      losses:stats[team].losses,
      saldo:stats[team].wins - stats[team].losses
    }
  }).sort((a,b)=>b.saldo-a.saldo);

  ranking.forEach(t=>{
    div.innerHTML +=
    "<p>"+t.name+
    " | Vitórias: "+t.wins+
    " | Derrotas: "+t.losses+
    " | Saldo: "+t.saldo+
    "</p>";
  });
}

/* ================= VOLTAR ================= */
function goBack(){
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("cadastroPage").classList.remove("hidden");
}

/* ================= INIT ================= */
renderTeams();
renderRanking();
</script>

</body>
</html>
