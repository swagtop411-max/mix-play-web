<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
min-height:100vh;
background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.85)),
url("background.jpg") center/cover no-repeat;
color:white;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.screen{
width:95%;
max-width:500px;
background:rgba(20,20,20,.7);
backdrop-filter:blur(15px);
border-radius:25px;
padding:25px;
box-shadow:0 0 40px rgba(0,255,200,.2);
animation:fadeIn .6s ease;
}

h1{text-align:center;margin-bottom:20px}

textarea{
width:100%;
height:150px;
padding:10px;
border:none;
border-radius:12px;
margin-bottom:10px;
resize:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:15px;
margin-top:10px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(45deg,#00ff99,#00ccff);
transition:.2s;
}

button:hover{transform:scale(1.05)}

.card{
margin-top:15px;
padding:15px;
border-radius:15px;
background:rgba(255,255,255,.05);
text-align:center;
}

.fadeOut{
animation:fadeOut .5s forwards;
}

.fadeInSlide{
animation:fadeInSlide .6s ease;
}

@keyframes fadeOut{
to{opacity:0;transform:translateY(-20px)}
}

@keyframes fadeInSlide{
from{opacity:0;transform:translateX(40px)}
to{opacity:1;transform:translateX(0)}
}

.queue{
font-size:12px;
opacity:.7;
margin-top:10px;
}
</style>
</head>
<body>

<div id="setup" class="screen">
<h1>🏆 MIX PLAY</h1>
<p>Digite um time por linha (máx. 20)</p>
<textarea id="teamInput" placeholder="Ex:
Time A
Time B
Time C"></textarea>
<button onclick="start()">Iniciar Jogos</button>
</div>

<div id="game" class="screen" style="display:none;">
<h1>🔥 PARTIDA</h1>

<div class="card">
<h2 id="match"></h2>
<p id="info"></p>
</div>

<button onclick="winner(0)">Vitória Time 1</button>
<button onclick="winner(1)">Vitória Time 2</button>

<div class="queue" id="queueDisplay"></div>
</div>

<script>
let queue=[]
let current=[]
let streakCount=0
let winnerIndex=null

function start(){
let raw=teamInput.value.trim().split("\n").filter(t=>t.trim()!="")

if(raw.length < 3){
alert("Cadastre pelo menos 3 times.")
return
}

if(raw.length > 20){
alert("Máximo 20 times.")
return
}

queue=[...raw]
current=[queue.shift(), queue.shift()]
streakCount=0

setup.classList.add("fadeOut")

setTimeout(()=>{
setup.style.display="none"
game.style.display="block"
game.classList.add("fadeInSlide")
render()
},500)
}

function render(){
match.innerText=current[0]+" 🆚 "+current[1]
info.innerText="Vitórias seguidas: "+streakCount
queueDisplay.innerText="Fila: "+queue.join(" | ")
}

function winner(index){
let winnerTeam=current[index]
let loser=current[index===0?1:0]

if(winnerIndex===index){
streakCount++
}else{
streakCount=1
}

winnerIndex=index

if(streakCount >= 2){
queue.push(winnerTeam)
current=[queue.shift(), queue.shift()]
streakCount=0
}else{
queue.push(loser)
current=[winnerTeam, queue.shift()]
}

render()
}
</script>

</body>
</html>
