<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena M&M</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:url("https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

.container{
  background:rgba(0,0,0,0.75);
  min-height:100vh;
  padding:20px;
}

/* LOGO */
.logo{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  margin-bottom:15px;
}

.logo img{
  width:120px;
  border-radius:20px;
  box-shadow:0 0 25px rgba(255,215,0,0.5);
  animation:float 3s ease-in-out infinite;
}

.logo h2{
  margin:0;
  font-size:18px;
  color:#facc15;
  font-weight:bold;
}

@keyframes float{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
  100%{ transform:translateY(0); }
}

button{
  padding:12px 22px;
  margin:6px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
}

.blue{ background:#22c55e; color:white; }
.gray{ background:#ccc; color:black; }

input{
  padding:10px;
  border-radius:8px;
  border:none;
}

.hidden{ display:none; }

.card{
  background:rgba(30,41,59,0.85);
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>
<div class="container">

<div class="logo">
<img src="https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/IMG_20260319_232311_913.webp">
<h2>M&M Organização</h2>
</div>

<div id="cadastroPage">
<h1>🏐 Arena M&M</h1>

<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<button onclick="startGames()" class="blue">Iniciar Jogos</button>
</div>

<div id="gamePage" class="hidden">

<h1>🏐 Quadras</h1>

<div class="card">
<h2>Quadra A</h2>
<h3 id="quadraA"></h3>
<button onclick="win('A',1)" class="blue">Time 1 venceu</button>
<button onclick="win('A',2)" class="blue">Time 2 venceu</button>
</div>

<div class="card">
<h2>Quadra B</h2>
<h3 id="quadraB"></h3>
<button onclick="win('B',1)" class="blue">Time 1 venceu</button>
<button onclick="win('B',2)" class="blue">Time 2 venceu</button>
</div>

<h2 id="timer">00:00</h2>

<h2>📋 Fila</h2>
<div id="queue"></div>

<h2>🏆 Ranking</h2>
<div id="ranking"></div>

<button onclick="resetAll()" class="gray">Resetar</button>
<button onclick="goBack()" class="gray">Voltar</button>

</div>

</div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

let queue = [];
let quadraA = [];
let quadraB = [];

// CONTROLE DE VITÓRIAS
let streakA = 0;
let streakB = 0;
let lastWinnerA = null;
let lastWinnerB = null;

let timerInterval;
let seconds = 0;

function saveData(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

function addTeam(){
  const name = document.getElementById("teamInput").value.trim();
  if(!name) return;

  teams.push(name);
  stats[name] = {wins:0, losses:0};

  document.getElementById("teamInput").value="";
  saveData();
  renderTeams();
}

function renderTeams(){
  const list = document.getElementById("teamList");
  list.innerHTML="";
  teams.forEach((team,i)=>{
    list.innerHTML += `<li>${team} 
    <button onclick="removeTeam(${i})" class="gray">X</button></li>`;
  });
}

function removeTeam(i){
  delete stats[teams[i]];
  teams.splice(i,1);
  saveData();
  renderTeams();
}

function startGames(){
  if(teams.length < 2){
    alert("Precisa de pelo menos 2 times");
    return;
  }

  queue = [...teams];

  document.getElementById("cadastroPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  gerarQuadras();
  startTimer();
}

function gerarQuadras(){
  quadraA = [queue.shift(), queue.shift()];
  quadraB = queue.length >= 2 ? [queue.shift(), queue.shift()] : [];

  renderAll();
}

function win(quadra, teamNumber){

  let match = quadra === "A" ? quadraA : quadraB;
  if(match.length < 2) return;

  const winner = match[teamNumber-1];
  const loser = match[teamNumber===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;

  saveData();

  let streak = quadra === "A" ? streakA : streakB;
  let lastWinner = quadra === "A" ? lastWinnerA : lastWinnerB;

  if(lastWinner === winner){
    streak++;
  } else {
    streak = 1;
    lastWinner = winner;
  }

  // SE GANHOU 2 → SAI
  if(streak >= 2){
    queue.push(winner);
    queue.push(loser);

    match = [queue.shift(), queue.shift()];

    streak = 0;
    lastWinner = null;
  } else {
    // normal: vencedor fica
    queue.push(loser);

    match = [winner];
    if(queue.length){
      match.push(queue.shift());
    }
  }

  if(quadra === "A"){
    quadraA = match;
    streakA = streak;
    lastWinnerA = lastWinner;
  } else {
    quadraB = match;
    streakB = streak;
    lastWinnerB = lastWinner;
  }

  renderAll();
}

function renderAll(){
  renderQuadras();
  renderQueue();
  renderRanking();
}

function renderQuadras(){
  document.getElementById("quadraA").innerText =
    quadraA.length === 2 ? quadraA[0] + " 🆚 " + quadraA[1] : "Aguardando...";

  document.getElementById("quadraB").innerText =
    quadraB.length === 2 ? quadraB[0] + " 🆚 " + quadraB[1] : "Sem times suficientes";
}

function renderQueue(){
  const div = document.getElementById("queue");
  div.innerHTML="";
  queue.forEach((t,i)=>{
    div.innerHTML += `<p>${i+1}º - ${t}</p>`;
  });
}

function renderRanking(){
  const div = document.getElementById("ranking");
  div.innerHTML="";

  const ranking = Object.keys(stats).map(team=>{
    return {
      name:team,
      wins:stats[team].wins,
      losses:stats[team].losses,
      saldo:stats[team].wins - stats[team].losses
    }
  }).sort((a,b)=>b.saldo-a.saldo);

  ranking.forEach((t,i)=>{
    div.innerHTML += `<p ${i===0?"style='color:gold;font-weight:bold'":""}>
    ${i+1}º ${t.name} | 🏆 ${t.wins} | ❌ ${t.losses}
    </p>`;
  });
}

function startTimer(){
  clearInterval(timerInterval);
  seconds = 0;

  timerInterval = setInterval(()=>{
    seconds++;
    let m = String(Math.floor(seconds/60)).padStart(2,"0");
    let s = String(seconds%60).padStart(2,"0");
    document.getElementById("timer").innerText = m+":"+s;
  },1000);
}

function resetAll(){
  if(confirm("Resetar tudo?")){
    localStorage.clear();
    location.reload();
  }
}

function goBack(){
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("cadastroPage").classList.remove("hidden");
}

renderTeams();
renderRanking();
</script>

</body>
</html>
