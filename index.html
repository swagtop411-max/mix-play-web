<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play</title>

<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
min-height:100vh;
background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.85)),
url("background.jpg") center/cover no-repeat;
color:white;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.app{
width:95%;
max-width:420px;
background:rgba(20,20,20,.65);
backdrop-filter:blur(15px);
border-radius:25px;
padding:25px;
box-shadow:0 0 40px rgba(0,255,200,.2);
animation:fadeIn .5s ease;
position:relative;
}

h1{text-align:center;margin-bottom:15px}

input{
width:100%;
padding:10px;
margin-bottom:8px;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#00ff99,#00ccff);
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{transform:scale(1.05)}

.card{
margin-top:12px;
padding:15px;
border-radius:15px;
background:rgba(255,255,255,.05);
}

.medal{
position:absolute;
top:-40px;
right:-40px;
font-size:60px;
opacity:0;
animation:medalPop 1s ease forwards;
}

@keyframes medalPop{
0%{transform:scale(.2) rotate(-30deg);opacity:0}
60%{transform:scale(1.2)}
100%{transform:scale(1);opacity:1}
}

.fade{
animation:fadeSlide .4s ease;
}

@keyframes fadeSlide{
from{opacity:0;transform:translateX(20px)}
to{opacity:1;transform:translateX(0)}
}
</style>
</head>

<body>

<div class="app">
<h1>🏆 MIX PLAY</h1>

<div id="setup">
<input id="t1" placeholder="Time 1">
<input id="t2" placeholder="Time 2">
<input id="t3" placeholder="Time 3">
<input id="t4" placeholder="Time 4">
<button onclick="start()">Iniciar</button>
</div>

<div id="game" style="display:none;">
<div class="card fade">
<h3 id="match"></h3>
<p id="bench"></p>
</div>

<button onclick="winner(0)">Vitória Time 1</button>
<button onclick="winner(1)">Vitória Time 2</button>

<div class="card">
<strong>Ranking</strong>
<div id="ranking"></div>
</div>

<div class="card">
<strong>Estatísticas</strong>
<div id="stats"></div>
</div>
</div>
</div>

<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<script>
let teams=[]
let rankingData={}
let current=[]
let bench=[]
let winStreak=0
let lastWinner=null

function start(){
teams=[t1.value,t2.value,t3.value,t4.value]
if(teams.includes("")) return alert("Preencha todos")

teams.forEach(t=>{
rankingData[t]={wins:0,losses:0,streak:0}
})

current=[teams[0],teams[1]]
bench=[teams[2],teams[3]]

setup.style.display="none"
game.style.display="block"

render()
}

function render(){
match.innerText=current[0]+" vs "+current[1]
bench.innerText="Esperando: "+bench.join(" e ")
updateRanking()
updateStats()
}

function winner(index){
document.getElementById("winSound").play()

let winnerTeam=current[index]
let loser=current[index===0?1:0]

rankingData[winnerTeam].wins++
rankingData[winnerTeam].streak++
rankingData[loser].losses++
rankingData[loser].streak=0

if(rankingData[winnerTeam].streak>=3){
showMedal()
}

saveOnline()

rotate(index)
render()
}

function rotate(index){
let loser=current[index===0?1:0]
bench.push(loser)

current=[current[index],bench.shift()]
}

function showMedal(){
let medal=document.createElement("div")
medal.className="medal"
medal.innerText="🥇"
document.querySelector(".app").appendChild(medal)
setTimeout(()=>medal.remove(),1500)
}

function updateRanking(){
let sorted=Object.entries(rankingData)
.sort((a,b)=>b[1].wins-a[1].wins)

ranking.innerHTML=""
sorted.forEach(([team,data])=>{
ranking.innerHTML+=`${team}: ${data.wins} vitórias<br>`
})
}

function updateStats(){
let totalGames=Object.values(rankingData)
.reduce((acc,t)=>acc+t.wins,0)

stats.innerHTML=`Total de partidas: ${totalGames}`
}

// Firebase exemplo
function saveOnline(){
if(typeof firebase==="undefined") return
firebase.database().ref("mixplay").set(rankingData)
}

// PWA
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js")
}
</script>

</body>
</html>
