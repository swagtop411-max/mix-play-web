<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizador de Vôlei</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:#0f172a;
}

.container{
  padding:20px;
}

button{
  padding:12px 22px;
  margin:6px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

button:hover{ transform:scale(1.05); }

.blue{ background:#22c55e; color:white; }
.gray{ background:#ccc; color:black; }

input{
  padding:10px;
  border-radius:8px;
  border:none;
}

.hidden{ display:none; }

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>
<div class="container">

<!-- CADASTRO -->
<div id="cadastroPage">
<h1>🏐 Cadastro de Times</h1>

<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<button onclick="startGames()" class="blue">Iniciar Jogos</button>
</div>

<!-- JOGOS -->
<div id="gamePage" class="hidden">

<h1>🏐 Quadras</h1>

<div class="card">
<h2>Quadra A</h2>
<h3 id="quadraA"></h3>
<button onclick="win('A',1)" class="blue">Time 1 venceu</button>
<button onclick="win('A',2)" class="blue">Time 2 venceu</button>
</div>

<div class="card">
<h2>Quadra B</h2>
<h3 id="quadraB"></h3>
<button onclick="win('B',1)" class="blue">Time 1 venceu</button>
<button onclick="win('B',2)" class="blue">Time 2 venceu</button>
</div>

<h2 id="timer">00:00</h2>

<h2>📋 Fila</h2>
<div id="queue"></div>

<h2>🏆 Ranking</h2>
<div id="ranking"></div>

<button onclick="resetAll()" class="gray">Resetar</button>
<button onclick="goBack()" class="gray">Voltar</button>

</div>

</div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

let queue = [];
let quadraA = [];
let quadraB = [];

let timerInterval;
let seconds = 0;

/* SALVAR */
function saveData(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

/* CADASTRO */
function addTeam(){
  const name = document.getElementById("teamInput").value.trim();
  if(!name) return;

  teams.push(name);
  stats[name] = {wins:0, losses:0};

  document.getElementById("teamInput").value="";
  saveData();
  renderTeams();
}

function renderTeams(){
  const list = document.getElementById("teamList");
  list.innerHTML="";
  teams.forEach((team,i)=>{
    list.innerHTML += `<li>${team} 
    <button onclick="removeTeam(${i})" class="gray">X</button></li>`;
  });
}

function removeTeam(i){
  delete stats[teams[i]];
  teams.splice(i,1);
  saveData();
  renderTeams();
}

/* INICIAR */
function startGames(){
  if(teams.length < 2){
    alert("Precisa de pelo menos 2 times");
    return;
  }

  queue = [...teams];

  document.getElementById("cadastroPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  gerarQuadras();
  startTimer();
}

/* GERAR JOGOS */
function gerarQuadras(){

  // evita erro com poucos times
  if(queue.length < 2){
    document.getElementById("quadraA").innerText = "Aguardando times...";
    document.getElementById("quadraB").innerText = "-";
    return;
  }

  quadraA = [queue.shift(), queue.shift()];

  if(queue.length >= 2){
    quadraB = [queue.shift(), queue.shift()];
  } else {
    quadraB = [];
  }

  renderQuadras();
  renderQueue();
  renderRanking();
}

/* RENDER */
function renderQuadras(){
  document.getElementById("quadraA").innerText =
    quadraA.length ? quadraA[0] + " 🆚 " + quadraA[1] : "-";

  document.getElementById("quadraB").innerText =
    quadraB.length ? quadraB[0] + " 🆚 " + quadraB[1] : "Sem times suficientes";
}

function renderQueue(){
  const div = document.getElementById("queue");
  div.innerHTML="";

  queue.forEach((t,i)=>{
    div.innerHTML += `<p>${i+1}º - ${t}</p>`;
  });
}

/* RESULTADO */
function win(quadra, teamNumber){

  let match = quadra === "A" ? quadraA : quadraB;
  if(match.length < 2) return;

  const winner = match[teamNumber-1];
  const loser = match[teamNumber===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;

  saveData();

  // perdedor vai pro final da fila
  queue.push(loser);

  // vencedor continua na quadra
  match = [winner];

  // adiciona próximo da fila
  if(queue.length){
    match.push(queue.shift());
  }

  if(quadra === "A") quadraA = match;
  else quadraB = match;

  renderQuadras();
  renderQueue();
  renderRanking();
}

/* TIMER */
function startTimer(){
  clearInterval(timerInterval);
  seconds = 0;

  timerInterval = setInterval(()=>{
    seconds++;
    let m = String(Math.floor(seconds/60)).padStart(2,"0");
    let s = String(seconds%60).padStart(2,"0");
    document.getElementById("timer").innerText = m+":"+s;
  },1000);
}

/* RANKING */
function renderRanking(){
  const div = document.getElementById("ranking");
  div.innerHTML="";

  const ranking = Object.keys(stats).map(team=>{
    return {
      name:team,
      wins:stats[team].wins,
      losses:stats[team].losses,
      saldo:stats[team].wins - stats[team].losses
    }
  }).sort((a,b)=>b.saldo-a.saldo);

  ranking.forEach((t,i)=>{
    div.innerHTML += `<p ${i===0?"style='color:gold'":""}>
    ${i+1}º ${t.name} | 🏆 ${t.wins} | ❌ ${t.losses} | 📊 ${t.saldo}
    </p>`;
  });
}

/* RESET */
function resetAll(){
  if(confirm("Resetar tudo?")){
    localStorage.clear();
    location.reload();
  }
}

/* VOLTAR */
function goBack(){
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("cadastroPage").classList.remove("hidden");
}

renderTeams();
renderRanking();
</script>

</body>
</html>
