<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play Web PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
min-height:100vh;
background:url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
.container{
width:100%;
max-width:500px;
background:rgba(0,0,0,0.88);
padding:25px;
border-radius:20px;
text-align:center;
}
h1{color:white;margin-bottom:20px;}
button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}
.btn-gold{background:#ffb300;color:black;}
.btn-green{background:#00c853;color:white;}
.btn-red{background:#d50000;color:white;}
.btn-blue{background:#2962ff;color:white;}
input{
width:100%;
padding:14px;
border-radius:10px;
border:none;
margin-bottom:12px;
font-size:16px;
}
.hidden{display:none;}
.team-card{
background:#1c1c1c;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}
.match-box{
background:#1c1c1c;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}
.timer{
font-size:32px;
font-weight:bold;
color:#00e676;
margin-bottom:15px;
}
.scoreboard{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
font-size:20px;
font-weight:bold;
color:white;
background:#111;
padding:12px;
border-radius:12px;
}
.scoreboard span{flex:1;text-align:center;}
.vs{color:#ffb300;}
.ranking-item{
display:flex;
justify-content:space-between;
color:white;
padding:6px 0;
}
.footer{margin-top:15px;color:#ffb300;font-weight:bold;}
</style>
</head>

<body>

<div class="container">

<div id="paginaInicial">
<h1>🏐 Mix Play Web PRO</h1>
<button class="btn-gold" onclick="desbloquear()">Desbloquear App</button>
<div class="footer">Criado por Murilo Pompeo</div>
</div>

<div id="paginaCadastro" class="hidden">
<h1>Cadastro de Times</h1>
<input type="text" id="nomeTime" placeholder="Nome do Time">
<button class="btn-green" onclick="adicionarTime()">Adicionar Time</button>
<div id="listaTimes"></div>
<button class="btn-blue" onclick="irParaPartidas()">Ir para Partidas</button>
<button class="btn-red" onclick="voltarInicio()">Voltar</button>
</div>

<div id="paginaPartidas" class="hidden">
<h1>Partidas</h1>

<div class="match-box">
<div class="timer" id="cronometro">00:00</div>
<div class="scoreboard">
<span id="time1Nome">---</span>
<span class="vs">VS</span>
<span id="time2Nome">---</span>
</div>
</div>

<button class="btn-green" onclick="definirVencedor(0)">Time 1 Venceu</button>
<button class="btn-green" onclick="definirVencedor(1)">Time 2 Venceu</button>

<h2 style="color:white;margin-top:15px;">Ranking</h2>
<div id="ranking"></div>

<button class="btn-blue" onclick="voltarCadastro()">Voltar</button>
</div>

</div>

<script>

let times = JSON.parse(localStorage.getItem("times")) || [];
let ranking = JSON.parse(localStorage.getItem("ranking")) || {};

let fila = [];
let atual = [];
let campeaoAtual = null;
let sequencia = 0;

let tempo=0;
let intervalo=null;

function salvar(){
localStorage.setItem("times",JSON.stringify(times));
localStorage.setItem("ranking",JSON.stringify(ranking));
}

function desbloquear(){
paginaInicial.classList.add("hidden");
paginaCadastro.classList.remove("hidden");
}

function voltarInicio(){
paginaCadastro.classList.add("hidden");
paginaInicial.classList.remove("hidden");
}

function adicionarTime(){
const nome=nomeTime.value.trim();
if(!nome)return;
times.push(nome);
ranking[nome]=ranking[nome]||0;
nomeTime.value="";
salvar();
renderizarTimes();
}

function excluirTime(i){
delete ranking[times[i]];
times.splice(i,1);
salvar();
renderizarTimes();
}

function renderizarTimes(){
listaTimes.innerHTML="";
times.forEach((t,i)=>{
listaTimes.innerHTML+=`
<div class="team-card">
<span>${t}</span>
<button class="btn-red" style="width:auto;padding:6px 12px;font-size:13px"
onclick="excluirTime(${i})">Excluir</button>
</div>`;
});
}

function irParaPartidas(){
if(times.length<2)return alert("Cadastre pelo menos 2 times");
fila=[...times];
embaralhar(fila);
gerarPartidaInicial();
paginaCadastro.classList.add("hidden");
paginaPartidas.classList.remove("hidden");
atualizarRanking();
}

function voltarCadastro(){
paginaPartidas.classList.add("hidden");
paginaCadastro.classList.remove("hidden");
}

function gerarPartidaInicial(){
atual=[fila.shift(),fila.shift()];
time1Nome.innerText=atual[0];
time2Nome.innerText=atual[1];
resetarCronometro();
}

function definirVencedor(index){

let vencedor = atual[index];
let perdedor = atual[index===0?1:0];

ranking[vencedor]++;
salvar();

if(campeaoAtual === vencedor){
sequencia++;
}else{
sequencia=1;
campeaoAtual=vencedor;
}

if(sequencia === 1){
// joga novamente
let proximo = pegarProximo(perdedor);
atual=[vencedor,proximo];
}
else{
// saiu obrigatoriamente
sequencia=0;
campeaoAtual=null;
atual=[...pegarDoisNovos()];
}

time1Nome.innerText=atual[0];
time2Nome.innerText=atual[1];

atualizarRanking();
resetarCronometro();
}

function pegarProximo(excluir){
let disponiveis=times.filter(t=>t!==excluir && t!==campeaoAtual);
if(disponiveis.length===0) disponiveis=times.filter(t=>t!==excluir);
return disponiveis[Math.floor(Math.random()*disponiveis.length)];
}

function pegarDoisNovos(){
let copia=[...times];
embaralhar(copia);
return [copia[0],copia[1]];
}

function atualizarRanking(){
ranking.innerHTML="";
Object.entries(ranking)
.sort((a,b)=>b[1]-a[1])
.forEach(([t,p])=>{
ranking.innerHTML+=`
<div class="ranking-item">
<span>${t}</span>
<span>${p} vitórias</span>
</div>`;
});
}

function embaralhar(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function iniciarCronometro(){
clearInterval(intervalo);
intervalo=setInterval(()=>{
tempo++;
let m=Math.floor(tempo/60);
let s=tempo%60;
cronometro.innerText=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");
},1000);
}

function resetarCronometro(){
tempo=0;
cronometro.innerText="00:00";
iniciarCronometro();
}

renderizarTimes();
atualizarRanking();

</script>

</body>
</html>
