<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&M Organização</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:url("https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

.hidden{ display:none; }

.container{
  background:rgba(0,0,0,0.6);
  min-height:100vh;
  padding:20px;
}

/* BLOQUEIO */
#lockPage{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:rgba(0,0,0,0.85);
}

.lock-box{
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:20px;
}

.lock-box img{
  width:140px;
  border-radius:20px;
  box-shadow:0 0 25px gold;
}

/* UI */
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.blue{ background:#22c55e; color:white; }
.gray{ background:#ccc; color:black; }

.card{
  background:rgba(30,41,59,0.85);
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>

<!-- 🔒 BLOQUEIO -->
<div id="lockPage">
  <div class="lock-box">
    <img src="https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/IMG_20260319_232311_913.webp">
    <h2>M&M Organização</h2>

    <input type="password" id="passwordInput" placeholder="Senha">
    <br><br>
    <button onclick="unlock()">Entrar</button>
    <p id="errorMsg" style="color:red;"></p>
  </div>
</div>

<!-- 🔓 APP -->
<div id="app" class="hidden">
<div class="container">

<!-- CADASTRO -->
<div id="cadastroPage">
<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<select id="numCourts">
<option value="1">1 Quadra</option>
<option value="2">2 Quadras</option>
</select>

<br>
<button onclick="startGames()" class="blue">Iniciar</button>
</div>

<!-- JOGOS -->
<div id="gamePage" class="hidden">

<div class="card">
<h2>Quadra A</h2>
<h3 id="quadraAText"></h3>
<button onclick="win('A',1)">Time 1 venceu</button>
<button onclick="win('A',2)">Time 2 venceu</button>
</div>

<div id="quadraBBox" class="card">
<h2>Quadra B</h2>
<h3 id="quadraBText"></h3>
<button onclick="win('B',1)">Time 1 venceu</button>
<button onclick="win('B',2)">Time 2 venceu</button>
</div>

<h2 id="timer">00:00</h2>

<h2>Fila</h2>
<div id="queue"></div>

<h2>Ranking</h2>
<div id="ranking"></div>

<!-- 🔄 RESET -->
<button onclick="resetAll()" class="gray">🔄 Resetar Tudo</button>

</div>

</div>
</div>

<script>

/* 🔒 BLOQUEIO */
function unlock(){
  const senha = document.getElementById("passwordInput").value;
  if(senha === "147580"){
    document.getElementById("lockPage").style.display="none";
    document.getElementById("app").classList.remove("hidden");
  }else{
    document.getElementById("errorMsg").innerText="Senha incorreta";
  }
}

/* DADOS */
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

let queue = [];
let quadraA = [];
let quadraB = [];

let streakA = 0, streakB = 0;
let lastA = null, lastB = null;

let interval = null;

/* SAVE */
function save(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

/* CADASTRO */
function addTeam(){
  const input = document.getElementById("teamInput");
  const name = input.value.trim();
  if(!name) return;

  teams.push(name);
  stats[name] = {wins:0, losses:0};

  input.value="";
  save();
  renderTeams();
}

function renderTeams(){
  const list = document.getElementById("teamList");
  list.innerHTML="";
  teams.forEach(t => list.innerHTML += `<li>${t}</li>`);
}

/* START */
function startGames(){
  const numCourts = parseInt(document.getElementById("numCourts").value);

  if(teams.length < 2){
    alert("Cadastre pelo menos 2 times");
    return;
  }

  queue = [...teams];

  document.getElementById("cadastroPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  document.getElementById("quadraBBox").style.display =
    numCourts === 1 ? "none" : "block";

  gerarJogos(numCourts);
  startTimer();
}

/* GERAR */
function gerarJogos(numCourts){
  quadraA = queue.length>=2 ? [queue.shift(), queue.shift()] : [];
  quadraB = (numCourts===2 && queue.length>=2) ? [queue.shift(), queue.shift()] : [];
  render();
}

/* WIN (ganha 2 sai) */
function win(q,n){

  let match = q==="A"?quadraA:quadraB;
  if(match.length < 2) return;

  let winner = match[n-1];
  let loser = match[n===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;
  save();

  let streak = q==="A"?streakA:streakB;
  let last = q==="A"?lastA:lastB;

  if(last === winner){ streak++; }
  else{ streak=1; last=winner; }

  if(streak >= 2){
    queue.push(winner, loser);
    match = queue.length>=2 ? [queue.shift(), queue.shift()] : [];
    streak = 0;
    last = null;
  }else{
    queue.push(loser);
    match = [winner];
    if(queue.length) match.push(queue.shift());
  }

  if(q==="A"){ quadraA=match; streakA=streak; lastA=last; }
  else{ quadraB=match; streakB=streak; lastB=last; }

  render();
}

/* RENDER */
function render(){

  document.getElementById("quadraAText").innerText =
    quadraA.length===2 ? quadraA.join(" 🆚 ") : "-";

  document.getElementById("quadraBText").innerText =
    quadraB.length===2 ? quadraB.join(" 🆚 ") : "-";

  const qDiv = document.getElementById("queue");
  qDiv.innerHTML="";
  queue.forEach((t,i)=> qDiv.innerHTML += `<p>${i+1}º ${t}</p>`);

  const rDiv = document.getElementById("ranking");
  rDiv.innerHTML="";

  const ranking = Object.keys(stats).sort((a,b)=>stats[b].wins - stats[a].wins);

  ranking.forEach((t,i)=>{
    rDiv.innerHTML += `<p>${i+1}º ${t} - ${stats[t].wins} vitórias</p>`;
  });
}

/* TIMER */
function startTimer(){
  if(interval) clearInterval(interval);

  let sec = 0;
  interval = setInterval(()=>{
    sec++;
    document.getElementById("timer").innerText =
      String(Math.floor(sec/60)).padStart(2,"0")+":"+
      String(sec%60).padStart(2,"0");
  },1000);
}

/* RESET */
function resetAll(){

  if(!confirm("Apagar todos os dados?")) return;

  teams = [];
  stats = {};
  queue = [];
  quadraA = [];
  quadraB = [];

  streakA = 0;
  streakB = 0;
  lastA = null;
  lastB = null;

  localStorage.removeItem("teams");
  localStorage.removeItem("stats");

  renderTeams();
  render();

  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("cadastroPage").classList.remove("hidden");
}

/* INIT */
renderTeams();

</script>

</body>
</html>
