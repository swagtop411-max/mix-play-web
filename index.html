<script>

// =======================
// DADOS
// =======================
let times = [];
let vitorias = {};
let filaConfrontos = [];
let atual = [];
let tempo = 900;
let intervalo = null;

let vencedorAtual = null;
let streak = 0;

const STORAGE_KEY = "mixplay_times";


// =======================
// STORAGE
// =======================
function salvar(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    times: times,
    vitorias: vitorias
  }));
}

function carregar(){
  let data = localStorage.getItem(STORAGE_KEY);
  if(data){
    try{
      let obj = JSON.parse(data);
      times = obj.times || [];
      vitorias = obj.vitorias || {};
    }catch(e){
      times = [];
      vitorias = {};
    }
  }
}


// =======================
// EMBARALHAR
// =======================
function embaralhar(array){
  for(let i = array.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}


// =======================
// GERAR TODOS CONTRA TODOS
// =======================
function gerarFilaConfrontos(){
  filaConfrontos = [];

  for(let i = 0; i < times.length; i++){
    for(let j = i + 1; j < times.length; j++){
      filaConfrontos.push([times[i], times[j]]);
    }
  }

  embaralhar(filaConfrontos);
}


// =======================
// CADASTRO
// =======================
function addTime(){
  let nome = document.getElementById("nomeTime").value.trim();
  if(nome !== "" && !times.includes(nome)){
    times.push(nome);
    vitorias[nome] = 0;
    document.getElementById("nomeTime").value = "";
    mostrarTimes();
    atualizarRanking();
    salvar();
  }
}

function mostrarTimes(){
  let lista = document.getElementById("lista");
  lista.innerHTML = "";
  times.forEach((t,i)=>{
    lista.innerHTML += `<div>${t} <button onclick="remover(${i})">X</button></div>`;
  });
}

function remover(i){
  let nome = times[i];
  if(!confirm("Excluir " + nome + "?")) return;

  times.splice(i,1);
  delete vitorias[nome];

  mostrarTimes();
  atualizarRanking();
  salvar();
}


// =======================
// INICIAR
// =======================
function iniciar(){
  if(times.length < 2){
    alert("Cadastre pelo menos 2 times");
    return;
  }

  gerarFilaConfrontos();

  document.getElementById("cadastro").style.display="none";
  document.getElementById("partidas").style.display="block";

  gerarPartida();
}


// =======================
// GERAR PARTIDA
// =======================
function gerarPartida(){

  if(times.length < 2) return;

  if(filaConfrontos.length === 0){
    gerarFilaConfrontos();
  }

  // regra de no máximo 2 seguidas
  if(streak >= 2){
    vencedorAtual = null;
    streak = 0;
  }

  let proxima = null;

  if(vencedorAtual){
    let index = filaConfrontos.findIndex(p =>
      p[0] === vencedorAtual || p[1] === vencedorAtual
    );

    if(index !== -1){
      proxima = filaConfrontos.splice(index,1)[0];
    }
  }

  if(!proxima){
    proxima = filaConfrontos.shift();
  }

  atual = proxima;

  document.getElementById("jogo").innerHTML =
    atual[0] + " VS " + atual[1];

  resetTimer();
}


// =======================
// VENCEDOR
// =======================
function vencedor(num){

  if(!atual || atual.length < 2) return;

  clearInterval(intervalo);

  let nome = atual[num - 1];
  if(!nome) return;

  vitorias[nome]++;
  atualizarRanking();
  salvar();

  document.getElementById("jogo").innerHTML =
    "🏆 <span class='vencedor'>" + nome + " venceu!</span>";

  if(vencedorAtual === nome){
    streak++;
  } else {
    vencedorAtual = nome;
    streak = 1;
  }

  setTimeout(function(){
    gerarPartida();
  }, 2000);
}


// =======================
// TIMER
// =======================
function resetTimer(){
  tempo = 900;
  updateTimer();

  if(intervalo) clearInterval(intervalo);

  intervalo = setInterval(function(){
    tempo--;
    updateTimer();

    if(tempo <= 0){
      clearInterval(intervalo);
      alert("Tempo esgotado!");
    }

  },1000);
}

function updateTimer(){
  let min = Math.floor(tempo/60);
  let seg = tempo % 60;

  document.getElementById("timer").innerText =
    (min<10?"0":"")+min+":"+(seg<10?"0":"")+seg;
}


// =======================
// RANKING
// =======================
function atualizarRanking(){
  let rankingDiv = document.getElementById("ranking");
  rankingDiv.innerHTML = "";

  let ordenado = Object.entries(vitorias)
    .sort((a,b)=>b[1]-a[1]);

  ordenado.forEach(function(item,i){
    rankingDiv.innerHTML +=
      "<div>" + (i+1) + "º - " + item[0] +
      " (" + item[1] + " vitórias)</div>";
  });
}


// =======================
// VOLTAR
// =======================
function voltar(){
  if(intervalo) clearInterval(intervalo);
  document.getElementById("cadastro").style.display="block";
  document.getElementById("partidas").style.display="none";
}


// =======================
// INIT
// =======================
carregar();
mostrarTimes();
atualizarRanking();

</script>
