<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Times - Rota77</title>

<style>
body{
margin:0;
font-family:Arial;
background:url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
color:white;
text-align:center;
}

.overlay{
background:rgba(0,0,0,0.8);
min-height:100vh;
padding:20px;
}

input{
padding:10px;
border:none;
border-radius:5px;
width:70%;
}

button{
padding:10px;
border:none;
border-radius:5px;
margin:5px;
font-weight:bold;
cursor:pointer;
}

.add{background:#00c853;color:white;}
.go{background:#FFD600;color:black;}
.delete{background:red;color:white;}

.team{
background:rgba(255,255,255,0.1);
margin:5px auto;
padding:8px;
border-radius:5px;
display:flex;
justify-content:space-between;
max-width:400px;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🏐 Cadastro de Times</h1>

<input type="text" id="teamInput" placeholder="Nome do time">
<button class="add" onclick="addTeam()">Cadastrar</button>

<div id="teamList"></div>

<br>
<button class="go" onclick="goToMatches()">Ir para Partidas</button>

</div>

<script>

let teams = JSON.parse(localStorage.getItem("teams")) || [];

function save(){
localStorage.setItem("teams",JSON.stringify(teams));
}

function addTeam(){
let name=document.getElementById("teamInput").value.trim();
if(!name) return;
if(teams.includes(name)) return alert("Time já cadastrado");

teams.push(name);
document.getElementById("teamInput").value="";
save();
render();
}

function removeTeam(name){
teams=teams.filter(t=>t!==name);
save();
render();
}

function render(){
let list=document.getElementById("teamList");
list.innerHTML="";
teams.forEach(team=>{
let div=document.createElement("div");
div.className="team";

let span=document.createElement("span");
span.innerText=team;

let btn=document.createElement("button");
btn.innerText="Excluir";
btn.className="delete";
btn.onclick=()=>removeTeam(team);

div.appendChild(span);
div.appendChild(btn);
list.appendChild(div);
});
}

function goToMatches(){
window.location.href="partidas.html";
}

render();

</script>

</body>
</html>
