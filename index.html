<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play - Cadastro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:url("file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
background-size:cover;
color:white;
text-align:center;
}

.overlay{
background:rgba(0,0,0,0.6);
min-height:100vh;
padding:20px;
}

.container{
background:rgba(255,255,255,0.9);
color:black;
padding:20px;
border-radius:15px;
max-width:400px;
margin:auto;
}

input,button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
}

button{
background:#ff9800;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>
<div class="overlay">
<h1>🏐 Mix Play</h1>

<div class="container">
<h3>Cadastrar Time</h3>
<input type="text" id="nomeTime" placeholder="Nome do Time">
<button onclick="adicionarTime()">Adicionar</button>

<ul id="listaTimes"></ul>

<button onclick="irParaPartidas()">Ir para Partidas</button>
</div>
</div>

<script>
let times = JSON.parse(localStorage.getItem("times")) || [];

function adicionarTime(){
let nome = document.getElementById("nomeTime").value;
if(nome==="") return;

times.push({nome:nome, pontos:0});
localStorage.setItem("times", JSON.stringify(times));

document.getElementById("nomeTime").value="";
atualizarLista();
}

function atualizarLista(){
let lista = document.getElementById("listaTimes");
lista.innerHTML="";
times.forEach(t=>{
lista.innerHTML+="<li>"+t.nome+"</li>";
});
}

function irParaPartidas(){
window.location.href="partidas.html";
}

atualizarLista();
</script>
</body>
</html>
