<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena M&M</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:url("https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

/* BLOQUEIO */
#lockPage{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:rgba(0,0,0,0.85);
}

.lock-box{
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:20px;
}

.lock-box img{
  width:150px;
  border-radius:20px;
  box-shadow:0 0 30px gold;
}

.hidden{ display:none; }

.container{
  background:rgba(0,0,0,0.6);
  min-height:100vh;
  padding:20px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.blue{ background:#22c55e; color:white; }

.card{
  background:rgba(30,41,59,0.85);
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>

<!-- BLOQUEIO -->
<div id="lockPage">
  <div class="lock-box">
    <img src="https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/IMG_20260319_232311_913.webp">
    <h2>M&M Organização</h2>

    <input type="password" id="passwordInput" placeholder="Senha">
    <br><br>
    <button onclick="unlock()">Entrar</button>
    <p id="errorMsg" style="color:red;"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="container">

<div id="cadastroPage">
<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<select id="numCourts">
<option value="1">1 Quadra</option>
<option value="2">2 Quadras</option>
</select>

<button onclick="startGames()" class="blue">Iniciar</button>
</div>

<div id="gamePage" class="hidden">

<div class="card">
<h2>Quadra A</h2>
<h3 id="quadraAText"></h3>
<button onclick="win('A',1)">Time 1 venceu</button>
<button onclick="win('A',2)">Time 2 venceu</button>
</div>

<div id="quadraBBox" class="card">
<h2>Quadra B</h2>
<h3 id="quadraBText"></h3>
<button onclick="win('B',1)">Time 1 venceu</button>
<button onclick="win('B',2)">Time 2 venceu</button>
</div>

<h2 id="timer">00:00</h2>

<h2>Fila</h2>
<div id="queue"></div>

<h2>Ranking</h2>
<div id="ranking"></div>

</div>

</div>
</div>

<script>

/* BLOQUEIO */
function unlock(){
  const senha = document.getElementById("passwordInput").value;
  if(senha === "147580"){
    document.getElementById("lockPage").style.display="none";
    document.getElementById("app").classList.remove("hidden");
  }else{
    document.getElementById("errorMsg").innerText="Senha incorreta";
  }
}

/* DADOS */
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

let queue = [];
let quadraA = [];
let quadraB = [];

/* 🔥 CONTROLE GANHA 2 */
let streakA=0, streakB=0;
let lastA=null, lastB=null;

let interval=null;

function save(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

/* CADASTRO */
function addTeam(){
  const name = teamInput.value.trim();
  if(!name) return;

  teams.push(name);
  stats[name]={wins:0,losses:0};

  teamInput.value="";
  save();
  renderTeams();
}

function renderTeams(){
  teamList.innerHTML="";
  teams.forEach(t=> teamList.innerHTML+=`<li>${t}</li>`);
}

/* INICIAR */
function startGames(){
  const numCourts = parseInt(numCourts.value);

  if(teams.length<2) return alert("Cadastre times");

  queue=[...teams];

  cadastroPage.classList.add("hidden");
  gamePage.classList.remove("hidden");

  if(numCourts===1){
    quadraBBox.style.display="none";
  }

  gerar(numCourts);
  startTimer();
}

function gerar(numCourts){
  quadraA=[queue.shift(),queue.shift()];
  quadraB=(numCourts===2 && queue.length>=2)?[queue.shift(),queue.shift()]:[];
  render();
}

/* 🔥 WIN COM REGRA GANHA 2 */
function win(q,n){

  let match = q==="A"?quadraA:quadraB;
  if(match.length<2) return;

  let winner = match[n-1];
  let loser = match[n===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;
  save();

  let streak = q==="A"?streakA:streakB;
  let last = q==="A"?lastA:lastB;

  if(last===winner){
    streak++;
  }else{
    streak=1;
    last=winner;
  }

  if(streak>=2){
    // 🔥 SAI DA QUADRA
    queue.push(winner, loser);
    match = queue.length>=2 ? [queue.shift(), queue.shift()] : [];
    streak=0;
    last=null;
  }else{
    // continua
    queue.push(loser);
    match=[winner];
    if(queue.length) match.push(queue.shift());
  }

  if(q==="A"){
    quadraA=match; streakA=streak; lastA=last;
  }else{
    quadraB=match; streakB=streak; lastB=last;
  }

  render();
}

/* RENDER */
function render(){

  quadraAText.innerText = quadraA.length===2 ? quadraA.join(" 🆚 ") : "-";
  quadraBText.innerText = quadraB.length===2 ? quadraB.join(" 🆚 ") : "-";

  queue.innerHTML="";
  queue.forEach((t,i)=> queue.innerHTML+=`<p>${i+1}º ${t}</p>`);

  const rDiv=document.getElementById("ranking");
  rDiv.innerHTML="";

  let ranking=Object.keys(stats).sort((a,b)=>stats[b].wins-stats[a].wins);

  ranking.forEach((t,i)=>{
    rDiv.innerHTML+=`<p>${i+1}º ${t} - ${stats[t].wins}</p>`;
  });
}

/* TIMER */
function startTimer(){
  if(interval) clearInterval(interval);

  let sec=0;
  interval=setInterval(()=>{
    sec++;
    timer.innerText =
      String(Math.floor(sec/60)).padStart(2,"0")+":"+
      String(sec%60).padStart(2,"0");
  },1000);
}

renderTeams();

</script>

</body>
</html>
