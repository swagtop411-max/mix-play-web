<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Partidas - Rota77</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

body{
background:url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
color:white;
text-align:center;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
padding:20px;
}

h1{margin-bottom:15px}

input,button{
padding:10px;
border:none;
border-radius:8px;
margin:5px;
font-weight:bold;
}

button{
cursor:pointer;
background:#ffcc00;
}

button:hover{
background:#ffaa00;
}

.card{
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:12px;
margin:15px auto;
max-width:400px;
}

.timer{
font-size:22px;
margin-top:10px;
}

footer{
margin-top:40px;
font-size:14px;
opacity:0.8;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🏐 Gerenciador de Partidas</h1>

<div class="card">
<input type="text" id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()">Cadastrar Time</button>
<button onclick="deleteTeam()">Excluir Time</button>
</div>

<div class="card">
<h2>Partida Atual</h2>
<h3 id="match"></h3>
<button onclick="setWinner(1)">Time 1 Venceu</button>
<button onclick="setWinner(2)">Time 2 Venceu</button>
<div class="timer" id="timer">00:00</div>
</div>

<div class="card">
<h2>Ranking</h2>
<ul id="ranking"></ul>
</div>

<footer>
Criado por Murilo Pompeo
</footer>

<audio id="bgMusic" loop>
<source src="https://cdn.pixabay.com/download/audio/2023/03/21/audio_5f0c8e4cfa.mp3?filename=sport-rock-145474.mp3" type="audio/mpeg">
</audio>

<audio id="winSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b8c3b.mp3?filename=small-crowd-applause-6695.mp3" type="audio/mpeg">
</audio>

</div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let wins = JSON.parse(localStorage.getItem("wins")) || {};
let currentMatch = JSON.parse(localStorage.getItem("currentMatch")) || [];
let winStreak = JSON.parse(localStorage.getItem("winStreak")) || {team:null,count:0};

let seconds = 0;
let timerInterval;

const music = document.getElementById("bgMusic");
document.body.addEventListener("click",()=>{music.play()},{once:true});

function saveData(){
localStorage.setItem("teams",JSON.stringify(teams));
localStorage.setItem("wins",JSON.stringify(wins));
localStorage.setItem("currentMatch",JSON.stringify(currentMatch));
localStorage.setItem("winStreak",JSON.stringify(winStreak));
}

function addTeam(){
let name=document.getElementById("teamInput").value.trim();
if(!name) return;
if(teams.includes(name)) return alert("Time já cadastrado");

teams.push(name);
wins[name]=wins[name]||0;
document.getElementById("teamInput").value="";
saveData();
updateRanking();
generateMatch();
}

function deleteTeam(){
let name=prompt("Digite o nome do time para excluir:");
if(!name) return;
teams=teams.filter(t=>t!==name);
delete wins[name];
if(currentMatch.includes(name)) currentMatch=[];
saveData();
updateRanking();
generateMatch();
}

function generateMatch(){
if(teams.length<2) return;

if(currentMatch.length===2){
document.getElementById("match").innerText=currentMatch[0]+" VS "+currentMatch[1];
resetTimer();
return;
}

let available=[...teams];

if(winStreak.team && winStreak.count===1){
available=available.filter(t=>t!==winStreak.team);
let opponent=available[Math.floor(Math.random()*available.length)];
currentMatch=[winStreak.team,opponent];
}

else{
let shuffled=[...teams].sort(()=>0.5-Math.random());
currentMatch=[shuffled[0],shuffled[1]];
}

saveData();
document.getElementById("match").innerText=currentMatch[0]+" VS "+currentMatch[1];
resetTimer();
}

function setWinner(pos){
if(currentMatch.length<2) return;

let winner=currentMatch[pos-1];
let loser=currentMatch[pos===1?1:0];

wins[winner]=(wins[winner]||0)+1;
document.getElementById("winSound").play();

if(winStreak.team===winner){
winStreak.count++;
}else{
winStreak.team=winner;
winStreak.count=1;
}

if(winStreak.count===2){
winStreak={team:null,count:0};
currentMatch=[];
}else{
currentMatch=[];
}

saveData();
updateRanking();
generateMatch();
}

function updateRanking(){
let list=document.getElementById("ranking");
list.innerHTML="";
Object.keys(wins)
.sort((a,b)=>wins[b]-wins[a])
.forEach(team=>{
let li=document.createElement("li");
li.textContent=team+" - "+wins[team]+" vitórias";
list.appendChild(li);
});
}

function resetTimer(){
clearInterval(timerInterval);
seconds=0;
updateTimer();
timerInterval=setInterval(()=>{
seconds++;
updateTimer();
},1000);
}

function updateTimer(){
let min=Math.floor(seconds/60);
let sec=seconds%60;
document.getElementById("timer").innerText=
(min<10?"0":"")+min+":"+(sec<10?"0":"")+sec;
}

updateRanking();
generateMatch();
</script>

</body>
</html>
