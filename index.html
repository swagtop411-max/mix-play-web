<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena M&M</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:url("https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

.container{
  background:rgba(0,0,0,0.75);
  min-height:100vh;
  padding:20px;
}

.logo img{
  width:120px;
  border-radius:20px;
  margin-bottom:10px;
}

button{
  padding:10px 18px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.blue{ background:#22c55e; color:white; }
.gray{ background:#ccc; color:black; }

input, select{
  padding:8px;
  border-radius:6px;
  border:none;
}

.hidden{ display:none; }

.card{
  background:rgba(30,41,59,0.85);
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>
<div class="container">

<div class="logo">
<img src="https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/IMG_20260319_232311_913.webp">
<h2>M&M Organização</h2>
</div>

<!-- CADASTRO -->
<div id="cadastroPage">
<h1>🏐 Arena M&M</h1>

<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<h3>Quadras:</h3>
<select id="numCourts">
  <option value="1">1 Quadra</option>
  <option value="2">2 Quadras</option>
</select>

<br><br>
<button onclick="startGames()" class="blue">Iniciar Jogos</button>
</div>

<!-- JOGOS -->
<div id="gamePage" class="hidden">

<div class="card">
<h2>Quadra A</h2>
<h3 id="quadraAText"></h3>
<button onclick="win('A',1)" class="blue">Time 1 venceu</button>
<button onclick="win('A',2)" class="blue">Time 2 venceu</button>
</div>

<div id="quadraBBox" class="card">
<h2>Quadra B</h2>
<h3 id="quadraBText"></h3>
<button onclick="win('B',1)" class="blue">Time 1 venceu</button>
<button onclick="win('B',2)" class="blue">Time 2 venceu</button>
</div>

<h2 id="timer">00:00</h2>

<h2>Fila</h2>
<div id="queue"></div>

<h2>Ranking</h2>
<div id="ranking"></div>

<button onclick="resetAll()" class="gray">Resetar Dados</button>

</div>

</div>

<script>
/* ================= DADOS ================= */
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

let queue = [];
let quadraA = [];
let quadraB = [];

let streakA=0, streakB=0;
let lastA=null, lastB=null;

let numCourts = 1;

/* ================= SALVAR ================= */
function saveData(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

/* ================= CADASTRO ================= */
function addTeam(){
  const name = document.getElementById("teamInput").value.trim();
  if(!name) return;

  teams.push(name);
  stats[name] = {wins:0, losses:0};

  document.getElementById("teamInput").value="";
  saveData();
  renderTeams();
}

function renderTeams(){
  const list = document.getElementById("teamList");
  list.innerHTML="";
  teams.forEach((t,i)=>{
    list.innerHTML += `<li>${t}</li>`;
  });
}

/* ================= INICIAR ================= */
function startGames(){
  numCourts = parseInt(document.getElementById("numCourts").value);

  if(teams.length < 2){
    alert("Cadastre pelo menos 2 times");
    return;
  }

  queue = [...teams];

  document.getElementById("cadastroPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  if(numCourts === 1){
    document.getElementById("quadraBBox").style.display = "none";
  }

  gerarJogos();
  startTimer();
}

/* ================= GERAR ================= */
function gerarJogos(){
  quadraA = queue.length>=2 ? [queue.shift(), queue.shift()] : [];
  quadraB = (numCourts===2 && queue.length>=2) ? [queue.shift(), queue.shift()] : [];
  renderAll();
}

/* ================= RESULTADO ================= */
function win(quadra, num){
  let match = quadra==="A"?quadraA:quadraB;
  if(match.length < 2) return;

  let winner = match[num-1];
  let loser = match[num===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;
  saveData();

  let streak = quadra==="A"?streakA:streakB;
  let last = quadra==="A"?lastA:lastB;

  if(last === winner){
    streak++;
  } else {
    streak = 1;
    last = winner;
  }

  if(streak >= 2){
    queue.push(winner, loser);
    match = queue.length>=2 ? [queue.shift(), queue.shift()] : [];
    streak = 0;
    last = null;
  } else {
    queue.push(loser);
    match = [winner];
    if(queue.length) match.push(queue.shift());
  }

  if(quadra==="A"){
    quadraA = match; streakA = streak; lastA = last;
  } else {
    quadraB = match; streakB = streak; lastB = last;
  }

  renderAll();
}

/* ================= RENDER ================= */
function renderAll(){
  renderQuadras();
  renderQueue();
  renderRanking();
}

function renderQuadras(){
  document.getElementById("quadraAText").innerText =
    quadraA.length===2 ? quadraA.join(" 🆚 ") : "Aguardando...";

  document.getElementById("quadraBText").innerText =
    quadraB.length===2 ? quadraB.join(" 🆚 ") : "-";
}

function renderQueue(){
  const div = document.getElementById("queue");
  div.innerHTML="";
  queue.forEach((t,i)=>{
    div.innerHTML += `<p>${i+1}º - ${t}</p>`;
  });
}

function renderRanking(){
  const div = document.getElementById("ranking");
  div.innerHTML="";

  const ranking = Object.keys(stats).sort((a,b)=>stats[b].wins - stats[a].wins);

  ranking.forEach((t,i)=>{
    div.innerHTML += `<p ${i===0?"style='color:gold;font-weight:bold'":""}>
      ${i+1}º ${t} | 🏆 ${stats[t].wins} | ❌ ${stats[t].losses}
    </p>`;
  });
}

/* ================= TIMER ================= */
let sec=0;
function startTimer(){
  setInterval(()=>{
    sec++;
    let m = String(Math.floor(sec/60)).padStart(2,"0");
    let s = String(sec%60).padStart(2,"0");
    document.getElementById("timer").innerText = m+":"+s;
  },1000);
}

/* ================= RESET ================= */
function resetAll(){
  if(confirm("Apagar todos os dados?")){
    localStorage.clear();
    location.reload();
  }
}

/* ================= INIT ================= */
renderTeams();
renderRanking();
</script>

</body>
</html>
