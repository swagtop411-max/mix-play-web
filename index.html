<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mix Play - Gerador de Jogos em Loopin</title>

<meta name="description" content="Mix Play - Gerador automático de jogos em loop para campeonatos de duplas mistas. Sistema profissional com ranking, histórico e controle automático.">

<meta property="og:title" content="Mix Play - Gerador de Jogos em Loopin">
<meta property="og:description" content="Sistema profissional para geração automática de jogos em loop. Ideal para campeonatos de duplas mistas.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://swagtop411-max.github.io/mix-play-web/">

<link rel="icon" href="favicon.png">

<style>
/* ===== ESTILO PROFISSIONAL ===== */

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.screen{
width:95%;
max-width:520px;
padding:25px;
border-radius:25px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
box-shadow:0 0 40px rgba(0,255,200,.3);
animation:fade .5s ease;
}

.logo{
text-align:center;
font-size:24px;
font-weight:bold;
color:#00ffc8;
margin-bottom:5px;
}

.subtitle{
text-align:center;
font-size:13px;
opacity:.8;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-bottom:10px;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:15px;
font-weight:bold;
font-size:14px;
cursor:pointer;
margin-bottom:8px;
background:linear-gradient(45deg,#00ffc8,#0072ff);
color:black;
transition:.2s;
}

button:hover{transform:scale(1.05);}

.team-list{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:10px;
}

.team{
background:#00ffc8;
color:black;
padding:5px 10px;
border-radius:15px;
font-size:12px;
}

.match{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
text-align:center;
margin-bottom:10px;
}

.vs{font-size:22px;color:#00ffc8;margin:8px 0;}

.info{font-size:12px;opacity:.8;text-align:center;margin-top:5px;}

.ranking{
margin-top:10px;
font-size:12px;
max-height:120px;
overflow:auto;
}

.history{
font-size:11px;
max-height:80px;
overflow:auto;
margin-top:8px;
opacity:.8;
}

.footer{
margin-top:15px;
text-align:center;
font-size:10px;
opacity:.6;
}

@keyframes fade{
from{opacity:0;transform:translateY(15px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div class="screen" id="setup">

<div class="logo">🏐 MIX PLAY</div>
<div class="subtitle">Gerador de Jogos em Loopin</div>

<div id="teamList" class="team-list"></div>

<input id="teamInput" placeholder="Nome da dupla">
<button onclick="addTeam()">Adicionar Dupla</button>
<button onclick="start()">Iniciar Loopin</button>

<div class="footer">
Site oficial:<br>
swagtop411-max.github.io/mix-play-web
</div>

</div>

<div class="screen" id="game" style="display:none;">

<div class="logo">🔥 PARTIDA EM ANDAMENTO</div>

<div class="match">
<div id="t1"></div>
<div class="vs">VS</div>
<div id="t2"></div>
<div id="streak"></div>
</div>

<button onclick="win(0)">Vitória Time 1</button>
<button onclick="win(1)">Vitória Time 2</button>
<button onclick="reset()">Encerrar Campeonato</button>

<div class="info" id="matchCount"></div>

<div class="ranking" id="ranking"></div>
<div class="history" id="history"></div>

</div>

<script>
let teams=[]
let queue=[]
let current=[]
let streak=0
let lastWinner=null
let matches=0
let rankingData={}
let historyData=[]

function save(){
localStorage.setItem("mixplay_loopin",JSON.stringify({
teams,queue,current,streak,lastWinner,matches,rankingData,historyData
}))
}

function load(){
let data=localStorage.getItem("mixplay_loopin")
if(data){
let d=JSON.parse(data)
teams=d.teams
queue=d.queue
current=d.current
streak=d.streak
lastWinner=d.lastWinner
matches=d.matches
rankingData=d.rankingData
historyData=d.historyData
setup.style.display="none"
game.style.display="block"
renderMatch()
}
}

function addTeam(){
let name=teamInput.value.trim()
if(!name||teams.length>=20)return
teams.push(name)
rankingData[name]=0
teamInput.value=""
renderTeams()
save()
}

function renderTeams(){
teamList.innerHTML=""
teams.forEach(t=>{
teamList.innerHTML+=`<div class="team">${t}</div>`
})
}

function start(){
if(teams.length<3){alert("Mínimo 3 duplas");return}
queue=[...teams]
current=[queue.shift(),queue.shift()]
streak=0
matches=0
historyData=[]
setup.style.display="none"
game.style.display="block"
renderMatch()
save()
}

function renderMatch(){
t1.innerText=current[0]
t2.innerText=current[1]
streak.innerText="Vitórias seguidas: "+streak
matchCount.innerText="Total de partidas: "+matches
ranking.innerHTML="<b>🏆 Ranking:</b><br>"+Object.entries(rankingData)
.sort((a,b)=>b[1]-a[1])
.map(r=>r[0]+" - "+r[1]+" pts").join("<br>")
history.innerHTML="<b>📜 Histórico:</b><br>"+historyData.slice(-5).reverse().join("<br>")
save()
}

function win(index){
matches++
let winner=current[index]
let loser=current[index===0?1:0]
rankingData[winner]+=3
historyData.push(winner+" venceu "+loser)

if(lastWinner===index){streak++}else{streak=1}
lastWinner=index

if(streak>=2){
queue.push(winner)
current=[queue.shift(),queue.shift()]
streak=0
}else{
queue.push(loser)
current=[winner,queue.shift()]
}

renderMatch()
}

function reset(){
localStorage.removeItem("mixplay_loopin")
location.reload()
}

load()
</script>

</body>
</html>
