<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play - Beach Edition</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  background:
  linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
  url("background.jpg") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.screen{
  width:95%;
  max-width:500px;
  padding:25px;
  border-radius:25px;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,.08);
  box-shadow:0 0 40px rgba(255,200,0,.3);
  animation:fadeIn .6s ease;
}

h1{
  text-align:center;
  margin-bottom:20px;
  font-size:28px;
  letter-spacing:2px;
  color:#ffd54f;
}

.subtitle{
  text-align:center;
  margin-bottom:15px;
  font-size:14px;
  opacity:.8;
}

.team-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

.team-bubble{
  background:linear-gradient(45deg,#ff9800,#ff5722);
  padding:8px 14px;
  border-radius:20px;
  font-size:13px;
  animation:pop .3s ease;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:15px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:20px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(45deg,#00c6ff,#0072ff);
  transition:.2s;
}

button:hover{
  transform:scale(1.05);
}

.match-card{
  background:rgba(255,255,255,.1);
  padding:20px;
  border-radius:20px;
  text-align:center;
  margin-bottom:15px;
}

.vs{
  font-size:22px;
  margin:10px 0;
  color:#ffd54f;
}

.queue{
  font-size:12px;
  opacity:.8;
  text-align:center;
}

@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<!-- TELA CADASTRO -->
<div id="setup" class="screen">
<h1>🏐 BEACH CHAMPIONSHIP</h1>
<p class="subtitle">Cadastre até 20 duplas</p>

<div class="team-list" id="teamList"></div>

<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()">Adicionar Time</button>
<button onclick="start()">Iniciar Campeonato</button>
</div>

<!-- TELA JOGO -->
<div id="game" class="screen" style="display:none;">
<h1>🔥 PARTIDA</h1>

<div class="match-card">
<div id="team1"></div>
<div class="vs">VS</div>
<div id="team2"></div>
<p id="streakInfo"></p>
</div>

<button onclick="winner(0)">Vitória Time 1</button>
<button onclick="winner(1)">Vitória Time 2</button>

<div class="queue" id="queueDisplay"></div>
</div>

<script>
let teams=[]
let queue=[]
let current=[]
let streak=0
let lastWinner=null

function addTeam(){
let name=teamInput.value.trim()
if(!name) return
if(teams.length>=20) return alert("Máximo 20 times")
teams.push(name)
teamInput.value=""
renderTeams()
}

function renderTeams(){
teamList.innerHTML=""
teams.forEach(t=>{
teamList.innerHTML+=`<div class="team-bubble">${t}</div>`
})
}

function start(){
if(teams.length<3){
alert("Cadastre pelo menos 3 times")
return
}

queue=[...teams]
current=[queue.shift(), queue.shift()]
streak=0

setup.style.display="none"
game.style.display="block"

renderMatch()
}

function renderMatch(){
team1.innerText=current[0]
team2.innerText=current[1]
streakInfo.innerText="Vitórias seguidas: "+streak
queueDisplay.innerText="Fila: "+queue.join(" | ")
}

function winner(index){
let winner=current[index]
let loser=current[index===0?1:0]

if(lastWinner===index){
streak++
}else{
streak=1
}

lastWinner=index

if(streak>=2){
queue.push(winner)
current=[queue.shift(), queue.shift()]
streak=0
}else{
queue.push(loser)
current=[winner, queue.shift()]
}

renderMatch()
}
</script>

</body>
</html>
