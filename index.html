<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena M&M</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:url("https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

/* ================= BLOQUEIO ================= */
#lockPage{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:rgba(0,0,0,0.85);
}

.lock-box{
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:20px;
}

.lock-box img{
  width:150px;
  border-radius:20px;
  box-shadow:0 0 30px gold;
  margin-bottom:15px;
  animation:float 4s infinite;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

.lock-box input{
  padding:10px;
  border-radius:8px;
  border:none;
  text-align:center;
  font-size:16px;
}

.lock-box button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.error{
  color:red;
  margin-top:10px;
}

/* ================= APP ================= */
.container{
  background:rgba(0,0,0,0.6);
  min-height:100vh;
  padding:20px;
}

.hidden{ display:none; }

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.blue{ background:#22c55e; color:white; }
.gray{ background:#ccc; color:black; }

.card{
  background:rgba(30,41,59,0.85);
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>

<!-- 🔒 TELA DE BLOQUEIO -->
<div id="lockPage">
  <div class="lock-box">
    <img src="https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/IMG_20260319_232311_913.webp">
    <h2>M&M Organização</h2>

    <input type="password" id="passwordInput" placeholder="Digite a senha">
    <br>
    <button onclick="unlock()">Entrar</button>

    <div id="errorMsg" class="error"></div>
  </div>
</div>

<!-- 🔓 APP -->
<div id="app" class="hidden">

<div class="container">

<div id="cadastroPage">
<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<select id="numCourts">
<option value="1">1 Quadra</option>
<option value="2">2 Quadras</option>
</select>

<button onclick="startGames()" class="blue">Iniciar</button>
</div>

<div id="gamePage" class="hidden">

<div class="card">
<h2>Quadra A</h2>
<h3 id="quadraAText"></h3>
<button onclick="win('A',1)">Time 1 venceu</button>
<button onclick="win('A',2)">Time 2 venceu</button>
</div>

<div id="quadraBBox" class="card">
<h2>Quadra B</h2>
<h3 id="quadraBText"></h3>
<button onclick="win('B',1)">Time 1 venceu</button>
<button onclick="win('B',2)">Time 2 venceu</button>
</div>

<h2 id="timer">00:00</h2>

<h2>Fila</h2>
<div id="queue"></div>

<h2>Ranking</h2>
<div id="ranking"></div>

</div>

</div>
</div>

<script>

/* 🔒 DESBLOQUEIO */
function unlock(){
  const senha = document.getElementById("passwordInput").value;

  if(senha === "147580"){
    document.getElementById("lockPage").style.display = "none";
    document.getElementById("app").classList.remove("hidden");
  }else{
    document.getElementById("errorMsg").innerText = "Senha incorreta";
  }
}

/* ================= RESTO DO SEU SISTEMA (INALTERADO) ================= */

let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

let queue = [];
let quadraA = [];
let quadraB = [];

let interval=null;

function save(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

function addTeam(){
  const input = document.getElementById("teamInput");
  const name = input.value.trim();
  if(!name) return;

  teams.push(name);
  stats[name]={wins:0,losses:0};

  input.value="";
  save();
  renderTeams();
}

function renderTeams(){
  const list = document.getElementById("teamList");
  list.innerHTML="";
  teams.forEach(t=> list.innerHTML += `<li>${t}</li>`);
}

function startGames(){
  const numCourts = parseInt(document.getElementById("numCourts").value);

  if(teams.length<2){
    alert("Cadastre pelo menos 2 times");
    return;
  }

  queue=[...teams];

  document.getElementById("cadastroPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  if(numCourts===1){
    document.getElementById("quadraBBox").style.display="none";
  }

  gerar(numCourts);
  startTimer();
}

function gerar(numCourts){
  quadraA=[queue.shift(),queue.shift()];
  quadraB=(numCourts===2 && queue.length>=2)?[queue.shift(),queue.shift()]:[];
  render();
}

function win(q,n){
  let match=q==="A"?quadraA:quadraB;

  let winner=match[n-1];
  let loser=match[n===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;
  save();

  queue.push(loser);
  match=[winner,queue.shift()];

  if(q==="A") quadraA=match;
  else quadraB=match;

  render();
}

function render(){
  document.getElementById("quadraAText").innerText=quadraA.join(" 🆚 ");
  document.getElementById("quadraBText").innerText=quadraB.join(" 🆚 ");

  const qDiv=document.getElementById("queue");
  qDiv.innerHTML="";
  queue.forEach((t,i)=> qDiv.innerHTML+=`<p>${i+1}º ${t}</p>`);

  const rDiv=document.getElementById("ranking");
  rDiv.innerHTML="";

  let ranking=Object.keys(stats).sort((a,b)=>stats[b].wins-stats[a].wins);
  ranking.forEach((t,i)=>{
    rDiv.innerHTML+=`<p>${i+1}º ${t} - ${stats[t].wins}</p>`;
  });
}

function startTimer(){
  if(interval) clearInterval(interval);

  let sec=0;
  interval=setInterval(()=>{
    sec++;
    document.getElementById("timer").innerText =
      String(Math.floor(sec/60)).padStart(2,"0")+":"+
      String(sec%60).padStart(2,"0");
  },1000);
}

renderTeams();

</script>

</body>
</html>
