<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena M&M</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:url("https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

.container{
  background:rgba(0,0,0,0.75);
  min-height:100vh;
  padding:20px;
}

.logo{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.logo img{
  width:120px;
  border-radius:20px;
  box-shadow:0 0 25px rgba(255,215,0,0.5);
}

.blue{ background:#22c55e; }
.gray{ background:#ccc; color:black; }

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.hidden{ display:none; }

.card{
  background:rgba(30,41,59,0.85);
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>
<div class="container">

<div class="logo">
<img src="https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/IMG_20260319_232311_913.webp">
<h2>M&M Organização</h2>
</div>

<!-- CADASTRO -->
<div id="cadastroPage">
<h1>🏐 Arena M&M</h1>

<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<h3>Quantidade de quadras:</h3>
<select id="numCourts">
  <option value="1">1 Quadra</option>
  <option value="2">2 Quadras</option>
</select>

<br><br>
<button onclick="startGames()" class="blue">Iniciar</button>
</div>

<!-- JOGOS -->
<div id="gamePage" class="hidden">

<h2>Quadra A</h2>
<div class="card">
<h3 id="quadraA"></h3>
<button onclick="win('A',1)" class="blue">Time 1 venceu</button>
<button onclick="win('A',2)" class="blue">Time 2 venceu</button>
</div>

<div id="quadraBContainer">
<h2>Quadra B</h2>
<div class="card">
<h3 id="quadraB"></h3>
<button onclick="win('B',1)" class="blue">Time 1 venceu</button>
<button onclick="win('B',2)" class="blue">Time 2 venceu</button>
</div>
</div>

<h2 id="timer">00:00</h2>

<h2>Fila</h2>
<div id="queue"></div>

<h2>Ranking</h2>
<div id="ranking"></div>

<button onclick="goBack()" class="gray">Voltar</button>

</div>

</div>

<script>
let teams = [];
let stats = {};
let queue = [];
let quadraA = [];
let quadraB = [];

let streakA=0, streakB=0;
let lastA=null, lastB=null;

let numCourts = 1;

/* CADASTRO */
function addTeam(){
  let name = teamInput.value.trim();
  if(!name) return;
  teams.push(name);
  stats[name]={wins:0,losses:0};
  teamInput.value="";
  renderTeams();
}

function renderTeams(){
  teamList.innerHTML="";
  teams.forEach((t,i)=>{
    teamList.innerHTML+=`<li>${t}</li>`;
  });
}

/* INICIAR */
function startGames(){
  numCourts = parseInt(numCourtsSelect());
  if(teams.length<2) return alert("Poucos times");

  queue=[...teams];

  cadastroPage.classList.add("hidden");
  gamePage.classList.remove("hidden");

  if(numCourts===1){
    quadraBContainer.style.display="none";
  }

  gerar();
  startTimer();
}

function numCourtsSelect(){
  return document.getElementById("numCourts").value;
}

/* GERAR */
function gerar(){
  quadraA=[queue.shift(),queue.shift()];
  if(numCourts===2 && queue.length>=2){
    quadraB=[queue.shift(),queue.shift()];
  }
  render();
}

/* WIN */
function win(q,n){
  let match = q==="A"?quadraA:quadraB;
  if(match.length<2) return;

  let winner = match[n-1];
  let loser = match[n===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;

  let streak = q==="A"?streakA:streakB;
  let last = q==="A"?lastA:lastB;

  if(last===winner){streak++} else{streak=1; last=winner;}

  if(streak>=2){
    queue.push(winner,loser);
    match=[queue.shift(),queue.shift()];
    streak=0; last=null;
  }else{
    queue.push(loser);
    match=[winner, queue.shift()];
  }

  if(q==="A"){quadraA=match; streakA=streak; lastA=last;}
  else{quadraB=match; streakB=streak; lastB=last;}

  render();
}

/* RENDER */
function render(){
  quadraA.innerText=quadraA.join(" VS ");
  quadraB.innerText=quadraB.join(" VS ");
  
  queueDiv.innerHTML="";
  queue.forEach((t,i)=> queueDiv.innerHTML+=`<p>${i+1} - ${t}</p>`);

  let ranking=Object.keys(stats).sort((a,b)=>stats[b].wins-stats[a].wins);
  rankingDiv.innerHTML="";
  ranking.forEach(t=>{
    rankingDiv.innerHTML+=`<p>${t} | ${stats[t].wins}V</p>`;
  });
}

/* TIMER */
let s=0;
function startTimer(){
  setInterval(()=>{
    s++;
    timer.innerText=Math.floor(s/60)+":"+("0"+s%60).slice(-2);
  },1000);
}

function goBack(){
  location.reload();
}
</script>

</body>
</html>
