<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Times</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
    min-height:100vh;
    background:url("file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
    background-size:cover;
    color:#fff;
}
.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.75);
    padding:20px;
}
.container{max-width:600px;margin:auto;}
h1{text-align:center;margin-bottom:20px;}
input,button{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:6px;
}
button{
    background:#00c853;
    color:#fff;
    font-weight:bold;
}
.time{
    display:flex;
    justify-content:space-between;
    background:#1c1c1c;
    padding:8px;
    border-radius:6px;
    margin:5px 0;
}
.delete{
    background:#c62828;
    padding:5px 8px;
    font-size:12px;
}
</style>
</head>

<body>
<div class="overlay">
<div class="container">

<h1>Cadastro de Times</h1>

<input type="text" id="nomeTime" placeholder="Nome do Time">
<button onclick="adicionarTime()">Adicionar Time</button>

<div id="listaTimes"></div>

<button onclick="irParaPartidas()">Ir para Partidas</button>

</div>
</div>

<script>
let times = JSON.parse(localStorage.getItem("times")) || [];

function salvar(){
    localStorage.setItem("times", JSON.stringify(times));
}

function adicionarTime(){
    let nome = document.getElementById("nomeTime").value.trim();
    if(!nome) return;
    times.push({nome:nome, vitorias:0});
    document.getElementById("nomeTime").value="";
    salvar();
    atualizarLista();
}

function excluirTime(index){
    times.splice(index,1);
    salvar();
    atualizarLista();
}

function atualizarLista(){
    let lista = document.getElementById("listaTimes");
    lista.innerHTML="";
    times.forEach((t,i)=>{
        lista.innerHTML += `
        <div class="time">
            ${t.nome}
            <button class="delete" onclick="excluirTime(${i})">Excluir</button>
        </div>`;
    });
}

function irParaPartidas(){
    window.location.href = "partidas.html";
}

atualizarLista();
</script>

</body>
</html>
