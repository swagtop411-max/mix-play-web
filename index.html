<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play Web</title>

<style>
body{
background:black;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}
button{
padding:10px;
margin:5px;
}
.vencedor{
color:yellow;
font-weight:bold;
}
</style>
</head>
<body>

<h1>Mix Play Web</h1>

<div id="cadastro">
<input type="text" id="nomeTime" placeholder="Nome do Time">
<button onclick="addTime()">Adicionar</button>
<div id="lista"></div>
<button onclick="iniciar()">Iniciar</button>
</div>

<div id="partidas" style="display:none;">
<div id="jogo"></div>
<div id="timer">15:00</div>
<button onclick="vencedor(1)">Time 1 venceu</button>
<button onclick="vencedor(2)">Time 2 venceu</button>
<button onclick="voltar()">Voltar</button>

<h3>Ranking</h3>
<div id="ranking"></div>
</div>

<script>

let times=[];
let vitorias={};
let fila=[];
let atual=[];
let tempo=900;
let intervalo=null;
let vencedorAtual=null;
let streak=0;

function salvar(){
localStorage.setItem("mixplay",
JSON.stringify({times:times,vitorias:vitorias}));
}

function carregar(){
let data=localStorage.getItem("mixplay");
if(data){
let obj=JSON.parse(data);
times=obj.times||[];
vitorias=obj.vitorias||{};
}
}

function embaralhar(array){
for(let i=array.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
let temp=array[i];
array[i]=array[j];
array[j]=temp;
}
}

function gerarFila(){
fila=[];
for(let i=0;i<times.length;i++){
for(let j=i+1;j<times.length;j++){
fila.push([times[i],times[j]]);
}
}
embaralhar(fila);
}

function addTime(){
let nome=document.getElementById("nomeTime").value.trim();
if(nome!=="" && !times.includes(nome)){
times.push(nome);
vitorias[nome]=0;
document.getElementById("nomeTime").value="";
mostrarTimes();
atualizarRanking();
salvar();
}
}

function mostrarTimes(){
let lista=document.getElementById("lista");
lista.innerHTML="";
for(let i=0;i<times.length;i++){
lista.innerHTML+="<div>"+times[i]+"</div>";
}
}

function iniciar(){
if(times.length<2){
alert("Cadastre pelo menos 2 times");
return;
}
gerarFila();
document.getElementById("cadastro").style.display="none";
document.getElementById("partidas").style.display="block";
gerarPartida();
}

function gerarPartida(){

if(fila.length===0){
gerarFila();
}

if(streak>=2){
vencedorAtual=null;
streak=0;
}

let proxima=null;

if(vencedorAtual){
for(let i=0;i<fila.length;i++){
if(fila[i][0]===vencedorAtual || fila[i][1]===vencedorAtual){
proxima=fila.splice(i,1)[0];
break;
}
}
}

if(!proxima){
proxima=fila.shift();
}

atual=proxima;

document.getElementById("jogo").innerHTML=
atual[0]+" VS "+atual[1];

resetTimer();
}

function vencedor(num){

clearInterval(intervalo);

let nome=atual[num-1];
if(!nome)return;

vitorias[nome]++;
atualizarRanking();
salvar();

document.getElementById("jogo").innerHTML=
"<span class='vencedor'>"+nome+" venceu!</span>";

if(vencedorAtual===nome){
streak++;
}else{
vencedorAtual=nome;
streak=1;
}

setTimeout(function(){
gerarPartida();
},2000);
}

function resetTimer(){
tempo=900;
updateTimer();
clearInterval(intervalo);
intervalo=setInterval(function(){
tempo--;
updateTimer();
if(tempo<=0){
clearInterval(intervalo);
alert("Tempo esgotado");
}
},1000);
}

function updateTimer(){
let min=Math.floor(tempo/60);
let seg=tempo%60;
document.getElementById("timer").innerHTML=
(min<10?"0":"")+min+":"+(seg<10?"0":"")+seg;
}

function atualizarRanking(){
let r=document.getElementById("ranking");
r.innerHTML="";
let ordenado=Object.entries(vitorias).sort(function(a,b){
return b[1]-a[1];
});
for(let i=0;i<ordenado.length;i++){
r.innerHTML+=(i+1)+"º - "+ordenado[i][0]+" ("+ordenado[i][1]+")<br>";
}
}

function voltar(){
clearInterval(intervalo);
document.getElementById("cadastro").style.display="block";
document.getElementById("partidas").style.display="none";
}

carregar();
mostrarTimes();
atualizarRanking();

</script>

</body>
</html>
