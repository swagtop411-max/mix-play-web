<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play Web - Beach Edition</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
background-image:url("file_000000009aac71f5a38536be785d2478.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
color:white;
min-height:100vh;
}

.overlay{
background:rgba(0,0,0,0.65);
min-height:100vh;
padding:20px;
text-align:center;
}

h1{
margin-bottom:20px;
text-shadow:0 0 15px orange;
}

input,button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
}

button{
background:orange;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.partida{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.timer{
font-size:28px;
margin-top:15px;
color:#ffcc00;
text-shadow:0 0 10px yellow;
}

.vencedor{
color:yellow;
font-weight:bold;
font-size:24px;
}

#ranking div{
margin:5px 0;
}

footer{
position:fixed;
bottom:0;
width:100%;
text-align:center;
padding:8px;
background:rgba(0,0,0,0.7);
font-size:14px;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🏐 Mix Play Web</h1>

<div id="cadastro">
<input type="text" id="nomeTime" placeholder="Nome do Time">
<button onclick="addTime()">Adicionar</button>
<div id="lista"></div>
<button onclick="iniciar()">Iniciar Partidas</button>
</div>

<div id="partidas" style="display:none;">
<div class="partida" id="jogo"></div>
<div class="timer" id="timer">15:00</div>
<button onclick="vencedor(1)">Time 1 venceu</button>
<button onclick="vencedor(2)">Time 2 venceu</button>
<button onclick="voltar()">Voltar</button>

<h3 style="margin-top:20px;">🏆 Ranking</h3>
<div id="ranking"></div>
</div>

</div>

<footer>
Criado por Murilo Pompeo
</footer>

<script>

let times=[];
let vitorias={};
let fila=[];
let atual=[];
let tempo=900;
let intervalo=null;
let vencedorAtual=null;
let streak=0;

const STORAGE_KEY="mixplay_storage";

// ===== STORAGE =====
function salvar(){
localStorage.setItem(STORAGE_KEY,
JSON.stringify({times:times,vitorias:vitorias}));
}

function carregar(){
let data=localStorage.getItem(STORAGE_KEY);
if(data){
try{
let obj=JSON.parse(data);
times=obj.times||[];
vitorias=obj.vitorias||{};
}catch(e){
times=[];
vitorias={};
}
}
}

// ===== EMBARALHAR =====
function embaralhar(array){
for(let i=array.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
let temp=array[i];
array[i]=array[j];
array[j]=temp;
}
}

// ===== GERAR TODOS CONTRA TODOS =====
function gerarFila(){
fila=[];
for(let i=0;i<times.length;i++){
for(let j=i+1;j<times.length;j++){
fila.push([times[i],times[j]]);
}
}
embaralhar(fila);
}

// ===== CADASTRO =====
function addTime(){
let nome=document.getElementById("nomeTime").value.trim();
if(nome!=="" && !times.includes(nome)){
times.push(nome);
vitorias[nome]=0;
document.getElementById("nomeTime").value="";
mostrarTimes();
atualizarRanking();
salvar();
}
}

function mostrarTimes(){
let lista=document.getElementById("lista");
lista.innerHTML="";
for(let i=0;i<times.length;i++){
lista.innerHTML+="<div>"+times[i]+"</div>";
}
}

// ===== INICIAR =====
function iniciar(){
if(times.length<2){
alert("Cadastre pelo menos 2 times");
return;
}
gerarFila();
document.getElementById("cadastro").style.display="none";
document.getElementById("partidas").style.display="block";
gerarPartida();
}

// ===== GERAR PARTIDA =====
function gerarPartida(){

if(fila.length===0){
gerarFila();
}

if(streak>=2){
vencedorAtual=null;
streak=0;
}

let proxima=null;

if(vencedorAtual){
for(let i=0;i<fila.length;i++){
if(fila[i][0]===vencedorAtual || fila[i][1]===vencedorAtual){
proxima=fila.splice(i,1)[0];
break;
}
}
}

if(!proxima){
proxima=fila.shift();
}

atual=proxima;

document.getElementById("jogo").innerHTML=
atual[0]+" VS "+atual[1];

resetTimer();
}

// ===== VENCEDOR =====
function vencedor(num){

clearInterval(intervalo);

let nome=atual[num-1];
if(!nome)return;

vitorias[nome]++;
atualizarRanking();
salvar();

document.getElementById("jogo").innerHTML=
"<span class='vencedor'>"+nome+" venceu!</span>";

if(vencedorAtual===nome){
streak++;
}else{
vencedorAtual=nome;
streak=1;
}

setTimeout(function(){
gerarPartida();
},2000);
}

// ===== TIMER =====
function resetTimer(){
tempo=900;
updateTimer();
clearInterval(intervalo);
intervalo=setInterval(function(){
tempo--;
updateTimer();
if(tempo<=0){
clearInterval(intervalo);
alert("Tempo esgotado!");
}
},1000);
}

function updateTimer(){
let min=Math.floor(tempo/60);
let seg=tempo%60;
document.getElementById("timer").innerHTML=
(min<10?"0":"")+min+":"+(seg<10?"0":"")+seg;
}

// ===== RANKING =====
function atualizarRanking(){
let r=document.getElementById("ranking");
r.innerHTML="";
let ordenado=Object.entries(vitorias).sort(function(a,b){
return b[1]-a[1];
});
for(let i=0;i<ordenado.length;i++){
r.innerHTML+=(i+1)+"º - "+ordenado[i][0]+" ("+ordenado[i][1]+" vitórias)<br>";
}
}

// ===== VOLTAR =====
function voltar(){
clearInterval(intervalo);
document.getElementById("cadastro").style.display="block";
document.getElementById("partidas").style.display="none";
}

// ===== INIT =====
carregar();
mostrarTimes();
atualizarRanking();

</script>

</body>
</html>
