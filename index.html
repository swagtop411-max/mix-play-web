<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play - Arena Mode</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f0f0f,#1c1c2e);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
}

header{
    padding:20px;
    font-size:26px;
    font-weight:bold;
    background:linear-gradient(90deg,#00f2ff,#ff00f2);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.container{
    width:90%;
    max-width:600px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00f2ff,#ff00f2);
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.card{
    background:#26263f;
    padding:12px;
    border-radius:10px;
    margin-bottom:8px;
}

.match{
    background:#1f1f33;
    padding:20px;
    border-radius:10px;
    margin-top:15px;
    text-align:center;
    font-size:20px;
}
</style>
</head>
<body>

<header>MIX PLAY - ARENA MODE</header>

<div class="container">

<input type="text" id="teamName" placeholder="Nome do Time">
<button onclick="addTeam()">Adicionar Time</button>

<div id="teamsList"></div>

<button onclick="startArena()">Iniciar Arena</button>

<div id="arena"></div>

</div>

<script>

let queue = [];
let currentMatch = [];
let winStreak = 0;
let winnerTeam = null;

function addTeam(){
    const name = document.getElementById("teamName").value.trim();
    if(name !== ""){
        queue.push(name);
        document.getElementById("teamName").value="";
        renderTeams();
    }
}

function renderTeams(){
    const list = document.getElementById("teamsList");
    list.innerHTML="";
    queue.forEach(t=>{
        list.innerHTML+=`<div class="card">${t}</div>`;
    });
}

function startArena(){
    if(queue.length < 3){
        alert("Mínimo 3 times.");
        return;
    }

    currentMatch = [queue.shift(), queue.shift()];
    winStreak = 0;
    winnerTeam = null;
    showMatch();
}

function showMatch(){
    document.getElementById("arena").innerHTML = `
        <div class="match">
            ${currentMatch[0]} 🆚 ${currentMatch[1]}
            <br><br>
            <button onclick="declareWinner('${currentMatch[0]}')">${currentMatch[0]} venceu</button>
            <button onclick="declareWinner('${currentMatch[1]}')">${currentMatch[1]} venceu</button>
        </div>
    `;
}

function declareWinner(winner){
    if(winnerTeam === winner){
        winStreak++;
    } else {
        winStreak = 1;
    }

    winnerTeam = winner;

    let loser = currentMatch.find(t => t !== winner);
    queue.push(loser);

    if(winStreak >= 2){
        queue.push(winner);
        winnerTeam = null;
        winStreak = 0;

        currentMatch = [queue.shift(), queue.shift()];
    } else {
        currentMatch = [winner, queue.shift()];
    }

    showMatch();
}

</script>

</body>
</html>
