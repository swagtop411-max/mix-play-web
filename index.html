<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena M&M</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background:url("https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
  background-size:cover;
}

.container{
  background:rgba(0,0,0,0.75);
  min-height:100vh;
  padding:20px;
}

/* ================= LOGO PREMIUM ================= */
.logo{
  position:relative;
  margin-bottom:20px;
}

/* halo de destaque */
.logo::before{
  content:"";
  position:absolute;
  width:200px;
  height:200px;
  background:radial-gradient(circle, rgba(255,215,0,0.5), transparent);
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  filter:blur(20px);
  z-index:0;
}

/* imagem */
.logo img{
  width:160px; /* 🔥 maior */
  border-radius:25px;
  position:relative;
  z-index:1;

  /* brilho */
  box-shadow:
    0 0 25px rgba(255,215,0,0.6),
    0 10px 30px rgba(0,0,0,0.8);

  /* animação melhorada */
  animation:float 4s ease-in-out infinite;
}

/* nome */
.logo h2{
  margin-top:8px;
  font-size:18px;
  color:#facc15;
  letter-spacing:1px;
}

/* animação suave e visível */
@keyframes float{
  0%   { transform:translateY(0) scale(1); }
  50%  { transform:translateY(-12px) scale(1.03); }
  100% { transform:translateY(0) scale(1); }
}

/* ================= UI ================= */
button{
  padding:10px 18px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.blue{ background:#22c55e; color:white; }
.gray{ background:#ccc; color:black; }

input, select{
  padding:8px;
  border-radius:6px;
  border:none;
}

.hidden{ display:none; }

.card{
  background:rgba(30,41,59,0.85);
  padding:15px;
  border-radius:12px;
  margin:10px;
}
</style>
</head>

<body>
<div class="container">

<!-- LOGO -->
<div class="logo">
  <img src="https://raw.githubusercontent.com/swagtop411-max/mix-play-web/main/IMG_20260319_232311_913.webp">
  <h2>M&M Organização</h2>
</div>

<!-- CADASTRO -->
<div id="cadastroPage">
<h1>🏐 Arena M&M</h1>

<input id="teamInput" placeholder="Nome do time">
<button onclick="addTeam()" class="blue">Adicionar</button>

<ul id="teamList"></ul>

<h3>Quadras:</h3>
<select id="numCourts">
  <option value="1">1 Quadra</option>
  <option value="2">2 Quadras</option>
</select>

<br><br>
<button onclick="startGames()" class="blue">Iniciar Jogos</button>
</div>

<!-- JOGOS -->
<div id="gamePage" class="hidden">

<div class="card">
<h2>Quadra A</h2>
<h3 id="quadraAText"></h3>
<button onclick="win('A',1)" class="blue">Time 1 venceu</button>
<button onclick="win('A',2)" class="blue">Time 2 venceu</button>
</div>

<div id="quadraBBox" class="card">
<h2>Quadra B</h2>
<h3 id="quadraBText"></h3>
<button onclick="win('B',1)" class="blue">Time 1 venceu</button>
<button onclick="win('B',2)" class="blue">Time 2 venceu</button>
</div>

<h2 id="timer">00:00</h2>

<h2>Fila</h2>
<div id="queue"></div>

<h2>Ranking</h2>
<div id="ranking"></div>

<button onclick="resetAll()" class="gray">Resetar Dados</button>

</div>

</div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};

let queue = [];
let quadraA = [];
let quadraB = [];

let streakA=0, streakB=0;
let lastA=null, lastB=null;

let numCourts = 1;

function saveData(){
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("stats", JSON.stringify(stats));
}

function addTeam(){
  const name = teamInput.value.trim();
  if(!name) return;

  teams.push(name);
  stats[name] = {wins:0, losses:0};

  teamInput.value="";
  saveData();
  renderTeams();
}

function renderTeams(){
  teamList.innerHTML="";
  teams.forEach(t=>{
    teamList.innerHTML += `<li>${t}</li>`;
  });
}

function startGames(){
  numCourts = parseInt(numCourts.value);

  if(teams.length < 2){
    alert("Cadastre pelo menos 2 times");
    return;
  }

  queue = [...teams];

  cadastroPage.classList.add("hidden");
  gamePage.classList.remove("hidden");

  if(numCourts === 1){
    quadraBBox.style.display = "none";
  }

  gerarJogos();
  startTimer();
}

function gerarJogos(){
  quadraA = queue.length>=2 ? [queue.shift(), queue.shift()] : [];
  quadraB = (numCourts===2 && queue.length>=2) ? [queue.shift(), queue.shift()] : [];
  renderAll();
}

function win(q,n){
  let match = q==="A"?quadraA:quadraB;
  if(match.length<2) return;

  let winner = match[n-1];
  let loser = match[n===1?1:0];

  stats[winner].wins++;
  stats[loser].losses++;
  saveData();

  let streak = q==="A"?streakA:streakB;
  let last = q==="A"?lastA:lastB;

  if(last===winner){streak++} else{streak=1; last=winner;}

  if(streak>=2){
    queue.push(winner,loser);
    match = queue.length>=2 ? [queue.shift(), queue.shift()] : [];
    streak=0; last=null;
  }else{
    queue.push(loser);
    match=[winner];
    if(queue.length) match.push(queue.shift());
  }

  if(q==="A"){quadraA=match; streakA=streak; lastA=last;}
  else{quadraB=match; streakB=streak; lastB=last;}

  renderAll();
}

function renderAll(){
  quadraAText.innerText = quadraA.length===2 ? quadraA.join(" 🆚 ") : "Aguardando...";
  quadraBText.innerText = quadraB.length===2 ? quadraB.join(" 🆚 ") : "-";

  queue.innerHTML="";
  queue.forEach((t,i)=> queue.innerHTML+=`<p>${i+1}º - ${t}</p>`);

  let ranking = Object.keys(stats).sort((a,b)=>stats[b].wins-stats[a].wins);
  rankingDiv.innerHTML="";
  ranking.forEach((t,i)=>{
    rankingDiv.innerHTML += `<p ${i===0?"style='color:gold'":""}>
      ${i+1}º ${t} | 🏆 ${stats[t].wins}
    </p>`;
  });
}

let sec=0;
function startTimer(){
  setInterval(()=>{
    sec++;
    timer.innerText =
      String(Math.floor(sec/60)).padStart(2,"0")+":"+
      String(sec%60).padStart(2,"0");
  },1000);
}

function resetAll(){
  if(confirm("Apagar dados?")){
    localStorage.clear();
    location.reload();
  }
}

renderTeams();
</script>

</body>
</html>
