<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play Web - Beach Edition</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}

body{
background:url("file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
background-size:cover;
color:white;
text-align:center;
min-height:100vh;
display:flex;
flex-direction:column;
}

.overlay{
background:rgba(0,0,0,0.6);
flex:1;
padding:20px;
}

h1{
margin-bottom:20px;
text-shadow:0 0 15px orange;
}

input,button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
}

button{
background:orange;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.lista-times{
margin-top:15px;
}

.partida{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.timer{
font-size:28px;
margin-top:15px;
color:#ffcc00;
text-shadow:0 0 10px yellow;
}

.vencedor{
animation:brilho 1s infinite alternate;
}

@keyframes brilho{
from{text-shadow:0 0 5px white;}
to{text-shadow:0 0 25px orange;}
}

.rodape{
position:fixed;
bottom:0;
width:100%;
text-align:center;
padding:8px;
background:rgba(0,0,0,0.7);
font-size:14px;
}

.rodape span{
color:#ff9800;
font-weight:bold;
text-shadow:0 0 10px orange;
}

#ranking div{
margin:5px 0;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🏐 Mix Play Web</h1>

<!-- TELA DE CADASTRO -->
<div id="cadastro">
<input type="text" id="nomeTime" placeholder="Nome do Time">
<button onclick="addTime()">Adicionar</button>
<div class="lista-times" id="lista"></div>
<button onclick="iniciar()">Iniciar Partidas</button>
</div>

<!-- TELA DE PARTIDAS -->
<div id="partidas" style="display:none;">
<div class="partida" id="jogo"></div>
<div class="timer" id="timer">15:00</div>
<button onclick="vencedor(1)">Time 1 venceu</button>
<button onclick="vencedor(2)">Time 2 venceu</button>
<button onclick="voltar()">Voltar</button>

<h3 style="margin-top:20px;">🏆 Ranking de Vitórias</h3>
<div id="ranking"></div>
</div>

</div>

<footer class="rodape">
Criado por <span>Murilo Pompeo</span>
</footer>

<audio id="torcida" src="https://www.soundjay.com/human/cheering-01.mp3"></audio>
<audio id="fim" src="https://www.soundjay.com/button/beep-07.mp3"></audio>
<audio id="musica" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<script>
// Dados do sistema
let times=[];
let vitorias={};
let confrontos=[];
let atual=[];
let tempo=900;
let intervalo;
let streakVencedor=0; // Contador de partidas consecutivas do vencedor

// ADICIONAR TIME
function addTime(){
let nome=document.getElementById("nomeTime").value;
if(nome.trim()!="" && !times.includes(nome)){
times.push(nome);
vitorias[nome]=0;
document.getElementById("nomeTime").value="";
mostrarTimes();
atualizarRanking();
}
}

// MOSTRAR TIMES CADASTRADOS
function mostrarTimes(){
let lista=document.getElementById("lista");
lista.innerHTML="";
times.forEach((t,i)=>{
lista.innerHTML+=`<div>${t} <button onclick="remover(${i})">X</button></div>`;
});
}

// REMOVER TIME
function remover(i){
let nomeRemovido = times[i];
if(!confirm("Deseja excluir o time " + nomeRemovido + "?")) return;
times.splice(i,1);
delete vitorias[nomeRemovido];
mostrarTimes();
atualizarRanking();
}

// INICIAR PARTIDAS
function iniciar(){
if(times.length<2){alert("Cadastre pelo menos 2 times"); return;}
document.getElementById("cadastro").style.display="none";
document.getElementById("partidas").style.display="block";
document.getElementById("musica").play();
gerarPartida();
atualizarRanking();
}

// VOLTAR PARA CADASTRO
function voltar(){
document.getElementById("cadastro").style.display="block";
document.getElementById("partidas").style.display="none";
clearInterval(intervalo);
resetTimer();
streakVencedor=0;
}

// GERAR PARTIDA AUTOMÁTICA
function gerarPartida(){
if(confrontos.length >= (times.length*(times.length-1))/2){
confrontos=[];
}
let t1,t2,comb;

if(streakVencedor>0){
t1=atual[streakVencedor>=2?1:0]; // mantém vencedor se ainda não jogou 2 vezes
t2=Math.floor(Math.random()*times.length);
while(times[t2]==t1) t2=Math.floor(Math.random()*times.length);
} else {
do{
t1=Math.floor(Math.random()*times.length);
t2=Math.floor(Math.random()*times.length);
}while(t1==t2);
}

comb=[times[t1],times[t2]].sort().join("-");
if(confrontos.includes(comb)){
gerarPartida();
return;
}
confrontos.push(comb);
atual=[times[t1],times[t2]];
document.getElementById("jogo").innerHTML=`${atual[0]} VS ${atual[1]}`;
resetTimer();
}

// REGISTRAR VENCEDOR
function vencedor(num){
clearInterval(intervalo);
let nome=atual[num-1];
vitorias[nome]++;
document.getElementById("torcida").play();
document.getElementById("jogo").innerHTML=`🏆 <span class="vencedor">${nome} venceu!</span>`;
atualizarRanking();

// Atualiza streak
streakVencedor = (streakVencedor>0 && atual[num-1]==atual[0])? streakVencedor+1 : 1;

// Limita a 2 partidas consecutivas
if(streakVencedor>2) streakVencedor=0;

setTimeout(()=>{gerarPartida();},3000);
}

// CRONÔMETRO
function resetTimer(){
tempo=900;
updateTimer();
clearInterval(intervalo);
intervalo=setInterval(()=>{
tempo--;
updateTimer();
if(tempo<=0){
clearInterval(intervalo);
document.getElementById("fim").play();
alert("Tempo esgotado!");
}
},1000);
}

function updateTimer(){
let min=Math.floor(tempo/60);
let seg=tempo%60;
document.getElementById("timer").innerText=
(min<10?"0":"")+min+":"+(seg<10?"0":"")+seg;
}

// ATUALIZAR RANKING
function atualizarRanking(){
let rankingDiv = document.getElementById("ranking");
rankingDiv.innerHTML="";
let ordenado = Object.entries(vitorias).sort((a,b)=>b[1]-a[1]);
ordenado.forEach(([nome,pontos],index)=>{
rankingDiv.innerHTML+=`<div>${index+1}º - ${nome} (${pontos} vitórias)</div>`;
});
}

// INICIALIZA LISTA
mostrarTimes();
atualizarRanking();

</script>

</body>
</html>
