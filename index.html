<script>

let teams = []
let currentMatch = []
let wins = {}
let matchNumber = 0

function addTeam(){
let input = document.getElementById("teamInput")
let name = input.value.trim()

if(name === ""){
alert("Digite um nome")
return
}

if(teams.includes(name)){
alert("Esse time já foi adicionado")
return
}

teams.push(name)
wins[name] = 0
input.value = ""
renderTeams()
}

function renderTeams(){
let list = document.getElementById("teamList")
list.innerHTML = ""
teams.forEach(team=>{
list.innerHTML += `<div class="team">${team}</div>`
})
}

function start(){
if(teams.length < 2){
alert("Adicione pelo menos 2 duplas")
return
}

document.getElementById("setup").style.display="none"
document.getElementById("game").style.display="block"
nextMatch()
}

function nextMatch(){
if(teams.length < 2) return

currentMatch = [
teams[Math.floor(Math.random()*teams.length)],
teams[Math.floor(Math.random()*teams.length)]
]

while(currentMatch[0] === currentMatch[1]){
currentMatch[1] = teams[Math.floor(Math.random()*teams.length)]
}

document.getElementById("t1").innerText = currentMatch[0]
document.getElementById("t2").innerText = currentMatch[1]

matchNumber++
document.getElementById("matchCount").innerText = "Partida #" + matchNumber

renderRanking()
}

function win(index){
let winner = currentMatch[index]
wins[winner]++
nextMatch()
}

function renderRanking(){
let ranking = document.getElementById("ranking")
ranking.innerHTML = "<h3>Ranking</h3>"

Object.keys(wins)
.sort((a,b)=>wins[b]-wins[a])
.forEach(team=>{
ranking.innerHTML += `<div>${team} - ${wins[team]} vitórias</div>`
})
}

function reset(){
location.reload()
}

</script>
