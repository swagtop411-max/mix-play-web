<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Partidas</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height:100vh;
    background: url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
    background-size: cover;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container {
    width:100%;
    max-width:500px;
    background:rgba(0,0,0,0.85);
    padding:25px;
    border-radius:20px;
}

h1 {
    text-align:center;
    color:white;
    margin-bottom:20px;
    font-size:28px;
}

input {
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    margin-bottom:12px;
    font-size:16px;
}

button {
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.btn-green {
    background:#00c853;
    color:white;
}

.btn-red {
    background:#d50000;
    color:white;
}

.btn-blue {
    background:#2962ff;
    color:white;
}

.team-card {
    background:#1c1c1c;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.hidden {
    display:none;
}

.match-box {
    background:#1c1c1c;
    padding:15px;
    border-radius:15px;
    text-align:center;
    margin-bottom:15px;
}

.ranking-item {
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<!-- PAGINA 1 -->
<div id="paginaCadastro">

<h1>Cadastro de Times</h1>

<input type="text" id="nomeTime" placeholder="Nome do Time">
<button class="btn-green" onclick="adicionarTime()">Adicionar Time</button>

<div id="listaTimes"></div>

<button class="btn-blue" onclick="irParaPartidas()">Ir para Partidas</button>

</div>

<!-- PAGINA 2 -->
<div id="paginaPartidas" class="hidden">

<h1>Partidas</h1>

<div class="match-box">
    <h2 id="confronto">---</h2>
</div>

<button class="btn-green" onclick="definirVencedor(1)">Time 1 Venceu</button>
<button class="btn-green" onclick="definirVencedor(2)">Time 2 Venceu</button>

<h2 style="color:white;margin-top:15px;">Ranking</h2>
<div id="ranking"></div>

<button class="btn-blue" onclick="voltarCadastro()">Voltar</button>

</div>

</div>

<audio id="musica" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5e4c8c0c1e.mp3" type="audio/mpeg">
</audio>

<script>

let times = JSON.parse(localStorage.getItem("times")) || [];
let ranking = JSON.parse(localStorage.getItem("ranking")) || {};
let fila = [];
let atual = [];
let vitoriasSeguidas = 0;

function salvarDados() {
    localStorage.setItem("times", JSON.stringify(times));
    localStorage.setItem("ranking", JSON.stringify(ranking));
}

function adicionarTime() {
    const nome = document.getElementById("nomeTime").value.trim();
    if (!nome) return;

    times.push(nome);
    ranking[nome] = ranking[nome] || 0;

    document.getElementById("nomeTime").value = "";
    salvarDados();
    renderizarTimes();
}

function excluirTime(index) {
    delete ranking[times[index]];
    times.splice(index,1);
    salvarDados();
    renderizarTimes();
}

function renderizarTimes() {
    const lista = document.getElementById("listaTimes");
    lista.innerHTML = "";

    times.forEach((time,index)=>{
        lista.innerHTML += `
        <div class="team-card">
            <span style="color:white">${time}</span>
            <button class="btn-red" style="width:auto;padding:6px 12px;font-size:13px"
            onclick="excluirTime(${index})">Excluir</button>
        </div>`;
    });
}

function irParaPartidas() {
    if (times.length < 2) return alert("Cadastre pelo menos 2 times");
    fila = [...times];
    embaralhar(fila);
    gerarPartida();
    document.getElementById("paginaCadastro").classList.add("hidden");
    document.getElementById("paginaPartidas").classList.remove("hidden");
    document.getElementById("musica").play();
}

function voltarCadastro() {
    document.getElementById("paginaCadastro").classList.remove("hidden");
    document.getElementById("paginaPartidas").classList.add("hidden");
}

function gerarPartida() {
    if (fila.length < 2) fila = [...times];

    atual = [fila.shift(), fila.shift()];
    document.getElementById("confronto").innerText =
        atual[0] + " VS " + atual[1];
}

function definirVencedor(num) {
    const vencedor = atual[num-1];
    ranking[vencedor]++;
    salvarDados();

    if (vitoriasSeguidas === 0) {
        vitoriasSeguidas = 1;
        fila.unshift(vencedor);
    } else {
        vitoriasSeguidas = 0;
    }

    atualizarRanking();
    gerarPartida();
}

function atualizarRanking() {
    const div = document.getElementById("ranking");
    div.innerHTML = "";

    Object.entries(ranking)
    .sort((a,b)=>b[1]-a[1])
    .forEach(([time,pontos])=>{
        div.innerHTML += `
        <div class="ranking-item">
            <span>${time}</span>
            <span>${pontos} vitórias</span>
        </div>`;
    });
}

function embaralhar(array) {
    for (let i = array.length -1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

renderizarTimes();
atualizarRanking();

</script>
</body>
</html>
