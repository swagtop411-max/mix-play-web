<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix Play PRO</title>

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(to top, #f4d03f, #16a085);
color:white;
text-align:center;
}

h1{
margin-top:20px;
font-size:28px;
}

.card{
background:rgba(0,0,0,0.6);
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
animation:fadeIn 0.6s ease;
}

input,button{
padding:12px;
margin:5px;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:#ff9800;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
background:#ffc107;
}

.team{
background:#ffffff22;
padding:8px;
margin:5px;
border-radius:8px;
}

#timer{
font-size:32px;
margin:15px 0;
font-weight:bold;
color:#ffeb3b;
}

.vs{
font-size:22px;
margin:10px 0;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<h1>🏐 Mix Play PRO</h1>

<div id="setup" class="card">
<h2>Adicionar Duplas</h2>
<input id="teamInput" placeholder="Nome da dupla">
<button onclick="addTeam()">Adicionar</button>
<div id="teamList"></div>
<br>
<button onclick="start()">Iniciar Jogo</button>
</div>

<div id="game" class="card" style="display:none;">
<h2>Partida Atual</h2>

<div id="timer">15:00</div>

<div class="vs">
<h3 id="t1"></h3>
VS
<h3 id="t2"></h3>
</div>

<button onclick="win(0)">Vitória Time 1</button>
<button onclick="win(1)">Vitória Time 2</button>

<div id="ranking"></div>

<br>
<button onclick="resetGame()">Resetar</button>
</div>

<script>

var teams=[];
var wins={};
var matchHistory=[];
var currentMatch=[];
var timerInterval;
var totalSeconds=900; // 15 minutos

function addTeam(){
var input=document.getElementById("teamInput");
var name=input.value.trim();

if(name==="" || teams.includes(name)) return;

teams.push(name);
wins[name]=0;
input.value="";
renderTeams();
}

function renderTeams(){
var list=document.getElementById("teamList");
list.innerHTML="";
teams.forEach(t=>{
list.innerHTML+= "<div class='team'>"+t+"</div>";
});
}

function start(){
if(teams.length<2){
alert("Adicione pelo menos 2 duplas");
return;
}

document.getElementById("setup").style.display="none";
document.getElementById("game").style.display="block";

generateMatch();
}

function generateMatch(){

// Se todos já se enfrentaram → reinicia ciclo
if(matchHistory.length >= (teams.length*(teams.length-1))/2){
matchHistory=[];
}

// Gera confronto único
var t1,t2,combo;
do{
t1=teams[Math.floor(Math.random()*teams.length)];
t2=teams[Math.floor(Math.random()*teams.length)];
combo=[t1,t2].sort().join("-");
}while(t1===t2 || matchHistory.includes(combo));

matchHistory.push(combo);
currentMatch=[t1,t2];

document.getElementById("t1").innerText=t1;
document.getElementById("t2").innerText=t2;

startTimer();
renderRanking();
}

function startTimer(){
clearInterval(timerInterval);
totalSeconds=900;

timerInterval=setInterval(function(){
totalSeconds--;
var min=Math.floor(totalSeconds/60);
var sec=totalSeconds%60;

if(sec<10) sec="0"+sec;

document.getElementById("timer").innerText=min+":"+sec;

if(totalSeconds<=0){
clearInterval(timerInterval);
generateMatch();
}

},1000);
}

function win(index){
var winner=currentMatch[index];
wins[winner]++;
clearInterval(timerInterval);
generateMatch();
}

function renderRanking(){
var ranking=document.getElementById("ranking");
ranking.innerHTML="<h3>Ranking</h3>";

var sorted=Object.keys(wins).sort((a,b)=>wins[b]-wins[a]);

sorted.forEach((t,i)=>{
ranking.innerHTML+="<div>"+(i+1)+"º - "+t+" ("+wins[t]+" vitórias)</div>";
});
}

function resetGame(){
location.reload();
}

</script>

</body>
</html>
