<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partidas</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
    min-height:100vh;
    background:url("file_000000009aac71f5a38536be785d2478.png") no-repeat center center fixed;
    background-size:cover;
    color:#fff;
}
.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.75);
    padding:20px;
}
.container{max-width:600px;margin:auto;text-align:center;}
.partida{
    background:#1c1c1c;
    padding:10px;
    border-radius:6px;
    margin-top:15px;
}
button{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:6px;
    font-weight:bold;
}
.vencedor{background:#2962ff;color:#fff;}
.voltar{background:#c62828;color:#fff;}
.cronometro{font-size:24px;margin-top:10px;}
.ranking{margin-top:20px;text-align:left;}
</style>
</head>

<body>
<div class="overlay">
<div class="container">

<h1>Partidas</h1>

<div class="partida" id="areaPartida"></div>

<button class="vencedor" onclick="definirVencedor(1)">Time 1 venceu</button>
<button class="vencedor" onclick="definirVencedor(2)">Time 2 venceu</button>

<div class="cronometro" id="cronometro">00:00</div>

<div class="ranking">
<h3>Ranking</h3>
<div id="rankingLista"></div>
</div>

<button class="voltar" onclick="voltar()">Voltar</button>

</div>
</div>

<script>

let times = JSON.parse(localStorage.getItem("times")) || [];
let fila = [...times];
let atual = [];
let contadorVitorias = 0;
let timer;
let segundos = 0;

if(times.length < 2){
    alert("Cadastre pelo menos 2 times");
    window.location.href="index.html";
}

function salvar(){
    localStorage.setItem("times", JSON.stringify(times));
}

function atualizarRanking(){
    let r = document.getElementById("rankingLista");
    r.innerHTML="";
    let ordenado = [...times].sort((a,b)=>b.vitorias-a.vitorias);
    ordenado.forEach(t=>{
        r.innerHTML += `<div>${t.nome} - ${t.vitorias} vitórias</div>`;
    });
}

function proximaPartida(){
    if(fila.length < 2){
        fila = [...times];
    }

    atual = [fila.shift(), fila.shift()];
    document.getElementById("areaPartida").innerText =
        atual[0].nome + " VS " + atual[1].nome;

    iniciarCronometro();
}

function definirVencedor(num){
    pararCronometro();

    let vencedor = atual[num-1];
    let perdedor = atual[num==1?1:0];

    vencedor.vitorias++;
    salvar();
    atualizarRanking();

    contadorVitorias++;

    if(contadorVitorias == 1){
        fila.unshift(vencedor);
    } else {
        contadorVitorias = 0;
        fila.push(vencedor);
    }

    fila.push(perdedor);

    proximaPartida();
}

function iniciarCronometro(){
    segundos=0;
    document.getElementById("cronometro").innerText="00:00";
    clearInterval(timer);
    timer=setInterval(()=>{
        segundos++;
        let min=String(Math.floor(segundos/60)).padStart(2,"0");
        let seg=String(segundos%60).padStart(2,"0");
        document.getElementById("cronometro").innerText=min+":"+seg;
    },1000);
}

function pararCronometro(){
    clearInterval(timer);
}

function voltar(){
    window.location.href="index.html";
}

atualizarRanking();
proximaPartida();

</script>

</body>
</html>
