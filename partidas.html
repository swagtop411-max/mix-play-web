<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partidas - Rota77</title>

<style>
body{
margin:0;
font-family:Arial;
background:url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
color:white;
text-align:center;
}

.overlay{
background:rgba(0,0,0,0.8);
min-height:100vh;
padding:20px;
}

button{
padding:10px;
border:none;
border-radius:5px;
margin:5px;
font-weight:bold;
cursor:pointer;
}

.win{background:#FFD600;color:black;}
.back{background:#00c853;color:white;}

#match{
font-size:24px;
margin:20px 0;
}

#timer{
font-size:20px;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🏐 Rei da Quadra</h1>

<div id="match">Carregando...</div>
<div id="timer">00:00</div>

<button class="win" onclick="setWinner(0)">Vitória Time 1</button>
<button class="win" onclick="setWinner(1)">Vitória Time 2</button>

<br><br>
<button class="back" onclick="goBack()">Voltar</button>

</div>

<script>

let teams = JSON.parse(localStorage.getItem("teams")) || [];
let wins = JSON.parse(localStorage.getItem("wins")) || {};
let champion = JSON.parse(localStorage.getItem("champion")) || null;
let streak = JSON.parse(localStorage.getItem("streak")) || 0;
let currentMatch = [];

let seconds=0;
let timerInterval;

function save(){
localStorage.setItem("wins",JSON.stringify(wins));
localStorage.setItem("champion",JSON.stringify(champion));
localStorage.setItem("streak",JSON.stringify(streak));
}

function generateMatch(){

if(teams.length<2){
document.getElementById("match").innerText="Cadastre pelo menos 2 times";
return;
}

if(champion && streak===1){
let opponents=teams.filter(t=>t!==champion);
let opponent=opponents[Math.floor(Math.random()*opponents.length)];
currentMatch=[champion,opponent];
}
else{

if(streak>=2){
champion=null;
streak=0;
}

let shuffled=[...teams].sort(()=>0.5-Math.random());
currentMatch=[shuffled[0],shuffled[1]];
}

document.getElementById("match").innerText=
currentMatch[0]+" VS "+currentMatch[1];

resetTimer();
}

function setWinner(index){

let winner=currentMatch[index];
wins[winner]=(wins[winner]||0)+1;

if(champion===winner){
streak++;
}else{
champion=winner;
streak=1;
}

save();
generateMatch();
}

function resetTimer(){
clearInterval(timerInterval);
seconds=0;
timerInterval=setInterval(()=>{
seconds++;
let m=Math.floor(seconds/60);
let s=seconds%60;
document.getElementById("timer").innerText=
(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
},1000);
}

function goBack(){
window.location.href="index.html";
}

generateMatch();

</script>

</body>
</html>
