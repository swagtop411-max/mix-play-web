<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partidas - Rota77</title>

<style>
body{
margin:0;
font-family:Arial;
background:url('file_000000009aac71f5a38536be785d2478.png') no-repeat center center fixed;
background-size:cover;
color:white;
text-align:center;
}

.overlay{
background:rgba(0,0,0,0.85);
min-height:100vh;
padding:20px;
}

button{
padding:10px;
border:none;
border-radius:5px;
margin:5px;
font-weight:bold;
cursor:pointer;
}

.win{background:#FFD600;color:black;}
.back{background:#00c853;color:white;}

#match{
font-size:24px;
margin:20px 0;
}

#winner{
font-size:18px;
color:#FFD600;
margin:10px 0;
}

#timer{
font-size:20px;
margin:10px 0;
}

ul{
list-style:none;
padding:0;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🏐 Rei da Quadra</h1>

<div id="match"></div>
<div id="winner"></div>
<div id="timer">00:00</div>

<button class="win" onclick="setWinner(0)">Vitória Time 1</button>
<button class="win" onclick="setWinner(1)">Vitória Time 2</button>

<h2>Ranking</h2>
<ul id="ranking"></ul>

<br>
<button class="back" onclick="goBack()">Voltar</button>

</div>

<script>

let teams = JSON.parse(localStorage.getItem("teams")) || [];
let wins = JSON.parse(localStorage.getItem("wins")) || {};
let champion = null;
let streak = 0;
let banned = null; // time que saiu após 2 vitórias
let currentMatch = [];

let seconds = 0;
let timerInterval;

function saveWins(){
localStorage.setItem("wins",JSON.stringify(wins));
}

function generateMatch(){

if(teams.length < 2){
document.getElementById("match").innerText="Cadastre pelo menos 2 times";
return;
}

let available = teams.filter(t => t !== banned);

if(champion && streak === 1){
let opponents = available.filter(t => t !== champion);
let opponent = opponents[Math.floor(Math.random()*opponents.length)];
currentMatch = [champion, opponent];
}
else{
let shuffled = [...available].sort(()=>0.5-Math.random());
currentMatch = [shuffled[0], shuffled[1]];
}

document.getElementById("match").innerText =
currentMatch[0] + " VS " + currentMatch[1];

resetTimer();
}

function setWinner(index){

let winner = currentMatch[index];
wins[winner] = (wins[winner] || 0) + 1;

document.getElementById("winner").innerText =
"🏆 Último vencedor: " + winner;

if(champion === winner){
streak++;
}else{
champion = winner;
streak = 1;
}

if(streak === 2){
banned = champion; // campeão sai
champion = null;
streak = 0;
}
else{
banned = null;
}

saveWins();
updateRanking();

setTimeout(()=>{
generateMatch();
},1200);
}

function updateRanking(){
let ul = document.getElementById("ranking");
ul.innerHTML="";
Object.keys(wins)
.sort((a,b)=>wins[b]-wins[a])
.forEach(team=>{
let li=document.createElement("li");
li.innerText=team+" - "+wins[team]+" vitórias";
ul.appendChild(li);
});
}

function resetTimer(){
clearInterval(timerInterval);
seconds=0;
timerInterval=setInterval(()=>{
seconds++;
let m=Math.floor(seconds/60);
let s=seconds%60;
document.getElementById("timer").innerText=
(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
},1000);
}

function goBack(){
window.location.href="index.html";
}

updateRanking();
generateMatch();

</script>

</body>
</html>
